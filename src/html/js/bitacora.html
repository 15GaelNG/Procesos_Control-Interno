<script>
  /*
   * Pantalla «Bitácora» (apiBitacora): solo lectura, lo más reciente primero.
   */
  function iniciarBitacora(raiz) {
    const q = function (campo) { return raiz.querySelector('[data-campo="' + campo + '"]'); };
    const contenido = q('contenido');
    const buscar = q('buscar');
    const filtro = q('filtro-accion');
    let entradas = null;

    const comparable = function (t) {
      return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    };
    const el = function (etiqueta, clase, texto) {
      const n = document.createElement(etiqueta);
      if (clase) n.className = clase;
      if (texto !== undefined) n.textContent = texto;
      return n;
    };

    function pintar() {
      const texto = comparable(buscar.value);
      contenido.textContent = '';
      const visibles = entradas.filter(function (e) {
        if (filtro.value && e.accion !== filtro.value) return false;
        return !texto || comparable([e.usuario, e.solicitud, e.detalle, e.nombreAccion].join(' ')).indexOf(texto) !== -1;
      });
      visibles.forEach(function (e) {
        const fila = el('div', 'bitacora-fila');
        const cabeza = el('div', 'bitacora-cabeza');
        cabeza.appendChild(el('span', 'chip', e.nombreAccion));
        cabeza.appendChild(el('span', 'bitacora-usuario', e.usuario));
        cabeza.appendChild(el('span', 'bitacora-fecha', e.fecha));
        fila.appendChild(cabeza);
        if (e.solicitud || e.estados) {
          fila.appendChild(el('div', 'bitacora-solicitud', [e.solicitud, e.estados].filter(Boolean).join(' · ')));
        }
        if (e.detalle) fila.appendChild(el('div', 'bitacora-detalle', e.detalle));
        contenido.appendChild(fila);
      });
      if (!visibles.length) {
        const v = el('div', 'vacio');
        v.appendChild(el('p', '', entradas.length ? 'Nada coincide con el filtro.' : 'La bitácora está vacía.'));
        contenido.appendChild(v);
      }
      q('resumen').textContent = 'Mostrando ' + visibles.length + ' de los ' + entradas.length + ' movimientos más recientes.';
    }

    buscar.addEventListener('input', function () { if (entradas) pintar(); });
    filtro.addEventListener('change', function () { if (entradas) pintar(); });

    llamar('apiBitacora').then(function (r) {
      if (!contenido.isConnected) return;
      entradas = r;
      const acciones = {};
      entradas.forEach(function (e) { acciones[e.accion] = e.nombreAccion; });
      Object.keys(acciones).sort(function (a, b) { return acciones[a].localeCompare(acciones[b], 'es'); }).forEach(function (a) {
        const o = el('option', '', acciones[a]);
        o.value = a;
        filtro.appendChild(o);
      });
      pintar();
    }).catch(function (e) {
      if (!contenido.isConnected) return;
      contenido.textContent = '';
      const v = el('div', 'vacio');
      v.appendChild(el('h2', '', 'No se pudo cargar la bitácora'));
      v.appendChild(el('p', '', e.message));
      contenido.appendChild(v);
    });
  }
</script>
