<script>
  /*
   * Paso 4 · Corrección con IA (apiAnalisis, apiAnalizar, apiDecidirPropuesta, apiAceptarPropuestas,
   * apiResponderPregunta, apiGuardarPendientesAnalisis). Dos trabajos: «Corregir redacción» (REDACCION,
   * corto y rápido) y «Analizar con IA» (ANALISIS: responsables, objetivo, alcance, preguntas…). La IA
   * propone y la persona decide: cada propuesta se acepta, se edita o se descarta (también todas de una
   * vez); las preguntas se responden (o «No aplica» / «No lo sé») y son obligatorias para continuar.
   *
   * Nada espera al servidor: cada decisión o respuesta cambia la pantalla al instante y se manda por
   * detrás, en orden (colaServidor); el objetivo, el alcance, etc. se guardan solos mientras se escribe.
   * Cuando ya no hay nada pendiente, la pantalla se compara con la del servidor (sin estorbar a quien
   * escribe). Si algo falla se avisa y se vuelve a pedir la pantalla.
   * Si la IA no contesta en reintentoIa.esperaSegundos, se lanza el mismo trabajo con otro modelo en
   * paralelo y se usa el primero que conteste (Apps Script no puede cancelar una llamada colgada).
   * Desde el paso 3, «Siguiente: corregir con IA» llega con estado.analizarAlAbrir y arranca solo.
   */
  const NOMBRES_CAMPO_PROPUESTA = { TEXTO: 'Redacción', RESPONSABLE: 'Responsable', OBJETIVO: 'Objetivo', ALCANCE: 'Alcance',
    RESPONSABILIDADES: 'Responsabilidades', DEFINICIONES: 'Definiciones', ORDEN: 'Orden' };
  const NOMBRES_DECISION = { ACEPTADA: 'Aceptada', EDITADA: 'Aceptada con cambios', RECHAZADA: 'Descartada' };
  const CAMPOS_DERIVADOS = [
    { clave: 'objetivo', campo: 'OBJETIVO', apartado: 'OBJETIVO', titulo: 'Objetivo', ayuda: 'Para qué existe este proceso.', lista: false },
    { clave: 'alcance', campo: 'ALCANCE', apartado: 'ALCANCE', titulo: 'Alcance', ayuda: 'Dónde empieza, dónde termina y a quién aplica.', lista: false },
    { clave: 'responsabilidades', campo: 'RESPONSABILIDADES', apartado: 'PUESTOS', titulo: 'Responsabilidades por puesto (opcional)',
      ayuda: 'Un renglón por puesto: «Puesto: lo que le toca». En el documento van junto a los puestos de las actividades («Puestos y responsabilidades»).', lista: true },
    { clave: 'definiciones', campo: 'DEFINICIONES', apartado: 'DEFINICIONES', titulo: 'Definiciones (opcional)', ayuda: 'Un renglón por término: «Término: qué significa».', lista: true }
  ];
  const CAMPOS_DEMAS = ['RESPONSABLE', 'OBJETIVO', 'ALCANCE', 'RESPONSABILIDADES', 'DEFINICIONES'];

  function iniciarAnalisis(raiz, idSolicitud) {
    const contenido = raiz.querySelector('[data-campo="contenido"]');
    let datos = null;
    let ui = null;
    let avisosIa = [];
    let resultadoIa = null;     /* Lo que pasó en el último análisis de esta pantalla: { ok… } o { error }. */
    let ocupadoIa = false;
    let textosIa = { titulo: '', nota: '' }; /* Lo que dice el aviso mientras la IA trabaja (sobrevive al repintar). */
    let borradores = {};        /* Respuestas escritas aún no vistas guardadas: { idPregunta: texto }. Sobreviven al repintar. */
    let derivadosEscritos = {}; /* Objetivo, alcance… escritos y aún no guardados: { clave: texto }. */
    const temporizadores = {};  /* Guardado automático de cada respuesta y de los derivados. */
    let colaServidor = Promise.resolve();
    let enCola = 0;
    let comparar = null;

    const q = function (campo, base) { return (base || ui).querySelector('[data-campo="' + campo + '"]'); };
    const lista = function (valores) {
      const ul = elemento('ul', 'lista-renglones');
      valores.forEach(function (v) { ul.appendChild(elemento('li', '', v)); });
      return ul;
    };
    const mostrarValor = function (caja, valor) {
      caja.textContent = '';
      if (Array.isArray(valor)) caja.appendChild(valor.length ? lista(valor) : elemento('span', 'nota', '(vacío)'));
      else caja.appendChild(elemento('span', valor ? '' : 'nota', valor || '(vacío)'));
    };
    const renglones = function (texto) { return String(texto || '').split('\n').map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean); };

    /* Pinta datos nuevos sin que la pantalla brinque. */
    function mostrar(d) {
      const vista = $('#vista');
      const arriba = vista.scrollTop;
      datos = d;
      recordarVista('analisis:' + idSolicitud, d);
      pintar();
      vista.scrollTop = arriba;
    }

    function recargar() {
      return llamar('apiAnalisis', idSolicitud).then(function (d) { if (contenido.isConnected) mostrar(d); });
    }

    /* ─────────── Lo que va al servidor, en orden y sin hacer esperar ─────────── */
    function alServidor(tarea) {
      enCola++;
      const p = colaServidor.then(tarea);
      colaServidor = p.catch(function () { /* la fila sigue aunque una tarea falle */ }).then(function () {
        enCola--;
        if (!enCola) compararConServidor();
      });
      return p.catch(function (e) {
        avisar(e.message, 'error');
        return recargar().catch(function () { /* se queda como estaba */ });
      });
    }

    /* Cuando ya no hay nada pendiente, trae la pantalla del servidor; se repinta si cambió y nadie escribe. */
    function compararConServidor() {
      clearTimeout(comparar);
      comparar = setTimeout(function () {
        if (enCola || ocupadoIa || !contenido.isConnected) return;
        llamar('apiAnalisis', idSolicitud).then(function (d) {
          if (enCola || ocupadoIa || !contenido.isConnected) return;
          if (JSON.stringify(d) === JSON.stringify(datos)) return;
          const escribiendo = document.activeElement && document.activeElement.tagName === 'TEXTAREA' && ui && ui.contains(document.activeElement);
          if (escribiendo) { datos = d; recordarVista('analisis:' + idSolicitud, d); } else mostrar(d);
        }).catch(function () { /* se queda la de la pantalla */ });
      }, 1500);
    }

    /* Lo escrito sin guardar: respuestas y objetivo, alcance, responsabilidades y definiciones. */
    function pendientes() {
      const p = {};
      const respuestas = Object.keys(borradores).filter(function (id) { return borradores[id].trim(); })
        .map(function (id) { return { id: id, texto: borradores[id] }; });
      if (respuestas.length) p.respuestas = respuestas;
      if (Object.keys(derivadosEscritos).length) p.derivados = derivadosActuales();
      return p.respuestas || p.derivados ? p : null;
    }

    /* El objetivo, alcance, etc. como están en pantalla (lo escrito o lo guardado). */
    function derivadosActuales() {
      const d = {};
      CAMPOS_DERIVADOS.forEach(function (c) {
        const guardado = datos.derivados[c.clave];
        d[c.clave] = derivadosEscritos[c.clave] !== undefined ? derivadosEscritos[c.clave] : (Array.isArray(guardado) ? guardado.join('\n') : guardado);
      });
      return d;
    }

    /* Manda lo pendiente (respuestas y derivados) en una sola llamada; devuelve cuando se guardó. */
    function guardarPendientes() {
      const p = pendientes();
      if (!p) return Promise.resolve();
      return alServidor(function () {
        return llamar('apiGuardarPendientesAnalisis', idSolicitud, p, true).then(function () { guardados(p); });
      });
    }

    /* Lo que ya quedó guardado deja de ser borrador (si no se volvió a cambiar mientras tanto). */
    function guardados(p) {
      (p.respuestas || []).forEach(function (r) { if (borradores[r.id] === r.texto) delete borradores[r.id]; });
      if (p.derivados) {
        CAMPOS_DERIVADOS.forEach(function (c) {
          const v = p.derivados[c.clave];
          datos.derivados[c.clave] = c.lista ? renglones(v) : String(v || '').trim();
          if (derivadosEscritos[c.clave] === v) delete derivadosEscritos[c.clave];
        });
        const indicador = ui && q('guardado-derivados');
        if (indicador && !Object.keys(derivadosEscritos).length) indicador.textContent = 'Guardado';
      }
    }

    /* Guarda sola una respuesta cuando se deja de escribir (sin volver a pintar la pantalla). */
    function guardarRespuestaSola(id, indicador) {
      const texto = borradores[id];
      if (!texto || !texto.trim()) return;
      indicador.textContent = 'Guardando…';
      alServidor(function () {
        return llamar('apiGuardarPendientesAnalisis', idSolicitud, { respuestas: [{ id: id, texto: texto }] }, true).then(function () {
          if (indicador.isConnected) indicador.textContent = borradores[id] === texto ? 'Guardada' : '';
        });
      });
    }

    function guardarDerivadosSolos() {
      const indicador = ui && q('guardado-derivados');
      if (indicador) indicador.textContent = 'Guardando…';
      const p = { derivados: derivadosActuales() };
      alServidor(function () {
        return llamar('apiGuardarPendientesAnalisis', idSolicitud, p, true).then(function () { guardados(p); });
      });
    }

    /* ─────────── Decisiones: la pantalla cambia al instante ─────────── */
    function actividadDe(id) { return datos.actividades.filter(function (a) { return a.id === id; })[0]; }

    /* Lo que cambia en pantalla al aceptar, editar o descartar una propuesta (lo mismo que hará el servidor). */
    function aplicarDecision(p, decision, valor) {
      p.decision = decision;
      if (decision === 'RECHAZADA') return;
      const final = decision === 'EDITADA' ? valor : p.propuesta;
      p.valorFinal = final;
      const derivado = CAMPOS_DERIVADOS.filter(function (c) { return c.campo === p.campo; })[0];
      if (derivado) {
        datos.derivados[derivado.clave] = derivado.lista ? (Array.isArray(final) ? final : renglones(final)) : String(final || '').trim();
        delete derivadosEscritos[derivado.clave];
      } else if (p.campo === 'TEXTO' && actividadDe(p.idActividad)) {
        actividadDe(p.idActividad).texto = String(final);
      } else if (p.campo === 'RESPONSABLE' && actividadDe(p.idActividad)) {
        actividadDe(p.idActividad).responsable = String(final);
        actividadDe(p.idActividad).responsableConfirmado = true;
      }
    }

    function decidir(p, decision, valor) {
      if (decision === 'EDITADA' && !(Array.isArray(valor) ? valor.length : String(valor || '').trim())) { avisar('Escribe cómo debe quedar.', 'error'); return; }
      aplicarDecision(p, decision, valor);
      mostrar(datos);
      alServidor(function () { return llamar('apiDecidirPropuesta', idSolicitud, p.id, decision, valor, true); });
    }

    function aceptarTodas(grupo, campos) {
      const suyas = datos.propuestas.filter(function (p) { return p.decision === 'PENDIENTE' && campos.indexOf(p.campo) !== -1; });
      suyas.forEach(function (p) { aplicarDecision(p, 'ACEPTADA'); });
      mostrar(datos);
      avisar(suyas.length === 1 ? 'Se aceptó 1 propuesta.' : 'Se aceptaron ' + suyas.length + ' propuestas.', 'exito');
      alServidor(function () {
        return llamar('apiAceptarPropuestas', idSolicitud, grupo, true).then(function (r) {
          if (r.sinAplicar) avisar(r.sinAplicar + ' no se aplicaron porque cambiaste esas actividades después del análisis.', '');
          if (r.estado === 'BORRADOR' && datos.solicitud.estado === 'CONFIRMADO') avisar('Cambiaste la solicitud después de confirmarla: tendrás que volver a confirmarla.', '');
        });
      });
    }

    function responder(pregunta, estadoR, texto) {
      if (estadoR === 'RESPONDIDA' && !String(texto || '').trim()) { avisar('Escribe la respuesta o elige «No aplica» o «No lo sé».', 'error'); return; }
      clearTimeout(temporizadores[pregunta.id]);
      delete borradores[pregunta.id];
      pregunta.estado = estadoR;
      pregunta.respuesta = estadoR === 'RESPONDIDA' ? String(texto).trim() : '';
      if (estadoR === 'RESPONDIDA' && pregunta.tipo === 'responsable' && actividadDe(pregunta.idActividad)) {
        actividadDe(pregunta.idActividad).responsable = pregunta.respuesta;
      }
      mostrar(datos);
      alServidor(function () { return llamar('apiResponderPregunta', idSolicitud, pregunta.id, estadoR, texto, true); });
    }

    /* ─────────── Tarjetas ─────────── */
    function tarjetaPropuesta(p, conEdicion) {
      const f = clonar('parte-propuesta');
      const card = f.querySelector('.propuesta');
      q('campo', card).textContent = NOMBRES_CAMPO_PROPUESTA[p.campo] || p.campo;
      if (p.campo === 'ORDEN') {
        q('bloque-antes', card).hidden = true;
        mostrarValor(q('propuesta', card), p.propuesta);
        q('justificacion', card).textContent = [p.evidencia, p.justificacion].filter(Boolean).join(' · ');
      } else if (p.campo === 'RESPONSABLE') {
        mostrarValor(q('antes', card), p.anterior || '');
        mostrarValor(q('propuesta', card), p.propuesta);
        q('justificacion', card).textContent = (p.evidencia ? 'Según tu texto: «' + p.evidencia + '». ' : '') + p.justificacion;
      } else {
        mostrarValor(q('antes', card), p.anterior);
        mostrarValor(q('propuesta', card), p.propuesta);
        q('justificacion', card).textContent = p.justificacion;
      }
      const botones = q('botones', card);
      if (p.decision !== 'PENDIENTE' || !datos.puedeEditar) {
        botones.hidden = true;
        if (p.decision !== 'PENDIENTE') {
          const chip = q('decision', card);
          chip.textContent = NOMBRES_DECISION[p.decision] || p.decision;
          chip.hidden = false;
        }
        return f;
      }
      const editar = card.querySelector('[data-accion="editar"]');
      if (!conEdicion) editar.hidden = true;
      if (p.campo === 'ORDEN') {
        card.querySelector('[data-accion="aceptar"]').lastChild.textContent = 'Entendido';
      }
      const caja = q('edicion', card);
      const area = caja.querySelector('textarea');
      card.querySelector('[data-accion="aceptar"]').addEventListener('click', function () { decidir(p, 'ACEPTADA'); });
      card.querySelector('[data-accion="descartar"]').addEventListener('click', function () { decidir(p, 'RECHAZADA'); });
      editar.addEventListener('click', function () {
        if (caja.hidden) {
          area.value = Array.isArray(p.propuesta) ? p.propuesta.join('\n') : p.propuesta;
          caja.hidden = false;
          editar.querySelector('span').textContent = 'Guardar mi versión';
          area.focus();
        } else {
          decidir(p, 'EDITADA', area.value);
        }
      });
      return f;
    }

    function tarjetaPregunta(pregunta) {
      const f = clonar('parte-pregunta');
      const card = f.querySelector('.pregunta');
      card.dataset.pregunta = pregunta.id;
      q('tipo', card).textContent = pregunta.nombreTipo;
      q('donde', card).textContent = pregunta.numero ? 'Actividad ' + pregunta.numero : 'General';
      q('texto', card).textContent = pregunta.pregunta;
      const form = q('formulario', card);
      const area = form.querySelector('textarea');
      const indicador = q('estado-borrador', card);
      /* Lo escrito y aún no visto guardado manda sobre lo que trae el servidor; si ya coincide, se olvida. */
      if (borradores[pregunta.id] !== undefined && borradores[pregunta.id] === pregunta.respuesta) delete borradores[pregunta.id];
      area.value = borradores[pregunta.id] !== undefined ? borradores[pregunta.id] : pregunta.respuesta;
      area.addEventListener('input', function () {
        borradores[pregunta.id] = area.value;
        indicador.textContent = 'Sin guardar…';
        clearTimeout(temporizadores[pregunta.id]);
        temporizadores[pregunta.id] = setTimeout(function () { guardarRespuestaSola(pregunta.id, indicador); }, 2000);
      });
      if (pregunta.estado !== 'PENDIENTE') {
        card.classList.add('respondida');
        const r = q('respondida', card);
        r.textContent = '';
        r.appendChild(elemento('span', '', pregunta.estado === 'RESPONDIDA' ? pregunta.respuesta : (pregunta.estado === 'NO_APLICA' ? 'No aplica' : 'No lo sé')));
        if (datos.puedeEditar) {
          const cambiar = elemento('button', 'enlace', 'Cambiar');
          cambiar.type = 'button';
          cambiar.addEventListener('click', function () { form.hidden = !form.hidden; });
          r.appendChild(cambiar);
        }
        r.hidden = false;
        form.hidden = true;
      }
      if (!datos.puedeEditar) form.hidden = true;
      form.querySelector('[data-accion="responder"]').addEventListener('click', function () { responder(pregunta, 'RESPONDIDA', area.value); });
      form.querySelector('[data-accion="no-aplica"]').addEventListener('click', function () { responder(pregunta, 'NO_APLICA', ''); });
      form.querySelector('[data-accion="no-se"]').addEventListener('click', function () { responder(pregunta, 'NO_LO_SE', ''); });
      return f;
    }

    /* Las preguntas que faltan (una escrita y aún sin guardar ya cuenta como contestada). */
    function preguntasPendientes() {
      return datos.preguntas.filter(function (x) { return x.estado === 'PENDIENTE' && !(borradores[x.id] || '').trim(); });
    }

    /* ─────────── Pintar ─────────── */
    function pintar() {
      contenido.textContent = '';
      contenido.appendChild(clonar('parte-analisis'));
      ui = contenido.querySelector('.analisis');
      pintarProgreso(raiz, datos.solicitud.estado);
      q('folio').textContent = datos.solicitud.id;
      q('nombre').textContent = datos.solicitud.nombre;
      q('ultimo').textContent = datos.ultimoAnalisis ? 'Último análisis: ' + datos.ultimoAnalisis : 'Todavía no se ha analizado.';

      [['redaccion', 'REDACCION'], ['analizar', 'ANALISIS']].forEach(function (x) {
        const boton = ui.querySelector('[data-accion="' + x[0] + '"]');
        boton.hidden = !datos.puedeEditar;
        boton.disabled = !datos.iaActiva || ocupadoIa;
        boton.addEventListener('click', function () {
          if (ocupadoIa) return;
          const pendientesP = datos.propuestas.filter(function (p) {
            return p.decision === 'PENDIENTE' && (x[1] === 'REDACCION' ? p.campo === 'TEXTO' : p.campo !== 'TEXTO');
          }).length;
          if (pendientesP && !confirm('Tienes ' + pendientesP + ' propuestas sin decidir. Al volver a pedirlo se reemplazan por nuevas. ¿Continuar?')) return;
          analizarAhora(x[1]);
        });
      });
      pintarResultado();
      q('ia-apagada').hidden = datos.iaActiva || !datos.puedeEditar;
      q('solo-lectura').hidden = datos.puedeEditar;
      if (ocupadoIa) {
        q('analizando').hidden = false;
        q('analizando-titulo').textContent = textosIa.titulo;
        q('analizando-nota').textContent = textosIa.nota;
      }

      if (avisosIa.length) {
        const caja = q('avisos');
        caja.appendChild(elemento('strong', '', 'Lo que el sistema descartó de la IA:'));
        caja.appendChild(lista(avisosIa));
        caja.hidden = false;
      }

      /* Preguntas: pendientes primero. */
      const preguntas = datos.preguntas.slice().sort(function (a, b) { return (a.estado !== 'PENDIENTE') - (b.estado !== 'PENDIENTE'); });
      const faltan = datos.preguntas.filter(function (x) { return x.estado === 'PENDIENTE'; }).length;
      if (preguntas.length) {
        q('seccion-preguntas').hidden = false;
        q('conteo-preguntas').textContent = faltan ? faltan + ' por responder' : 'Todas respondidas';
        q('conteo-preguntas').className = 'chip ' + (faltan ? 'dorado' : 'exito');
        preguntas.forEach(function (x) { q('preguntas').appendChild(tarjetaPregunta(x)); });
      }

      /* Propuestas de actividades, agrupadas por actividad. */
      const pendientesP = datos.propuestas.filter(function (p) { return p.decision === 'PENDIENTE'; });
      const deActividad = pendientesP.filter(function (p) { return p.campo === 'TEXTO' || p.campo === 'RESPONSABLE'; });
      const redaccion = pendientesP.filter(function (p) { return p.campo === 'TEXTO'; }).length;
      if (deActividad.length) {
        q('seccion-actividades').hidden = false;
        const todas = ui.querySelector('[data-accion="aceptar-redaccion"]');
        todas.hidden = !redaccion || !datos.puedeEditar;
        todas.querySelector('span').textContent = redaccion === 1 ? 'Aceptar la corrección de redacción' : 'Aceptar las ' + redaccion + ' correcciones de redacción';
        todas.addEventListener('click', function () { aceptarTodas('REDACCION', ['TEXTO']); });
        datos.actividades.forEach(function (a) {
          const suyas = deActividad.filter(function (p) { return p.idActividad === a.id; });
          if (!suyas.length) return;
          const grupo = elemento('div', 'grupo-actividad');
          grupo.appendChild(elemento('h3', '', 'Actividad ' + a.numero));
          suyas.forEach(function (p) { grupo.appendChild(tarjetaPropuesta(p, true)); });
          q('propuestas-actividades').appendChild(grupo);
        });
      }
      const orden = pendientesP.filter(function (p) { return p.campo === 'ORDEN'; });
      if (orden.length) {
        q('seccion-orden').hidden = false;
        orden.forEach(function (p) { q('propuestas-orden').appendChild(tarjetaPropuesta(p, false)); });
      }

      /* «Aceptar todas»: responsables, objetivo, alcance, responsabilidades y definiciones. */
      const demas = pendientesP.filter(function (p) { return CAMPOS_DEMAS.indexOf(p.campo) !== -1; }).length;
      const aceptarDemas = ui.querySelector('[data-accion="aceptar-demas"]');
      aceptarDemas.hidden = !demas || !datos.puedeEditar;
      aceptarDemas.querySelector('span').textContent = demas === 1 ? 'Aceptar la propuesta' : 'Aceptar todas las propuestas (' + demas + ')';
      aceptarDemas.title = 'Responsables, objetivo, alcance, responsabilidades y definiciones que propuso la IA';
      aceptarDemas.addEventListener('click', function () { aceptarTodas('DEMAS', CAMPOS_DEMAS); });

      /* Textos derivados: comentarios de Procesos, propuesta (si hay) y el campo, que se guarda solo. */
      const acciones = datos.puedeEditar ? {
        atender: function (o, texto, boton) {
          boton.disabled = true;
          llamar('apiCambiarObservacion', idSolicitud, o.id, 'ATENDER', texto).then(function () {
            o.estado = 'ATENDIDA';
            o.nombreEstado = 'Atendida';
            o.respuesta = String(texto || '').trim();
            avisar('Observación atendida.', 'exito');
            mostrar(datos);
          }).catch(function (e) { avisar(e.message, 'error'); boton.disabled = false; });
        }
      } : null;
      CAMPOS_DERIVADOS.forEach(function (c) {
        const bloque = elemento('div', 'derivado');
        bloque.dataset.apartado = c.apartado;
        bloque.appendChild(elemento('h3', '', c.titulo));
        bloque.appendChild(elemento('p', 'nota', c.ayuda));
        const comentarios = comentariosDe(datos.observaciones, c.apartado, '', acciones);
        if (comentarios) bloque.appendChild(comentarios);
        pendientesP.filter(function (p) { return p.campo === c.campo; }).forEach(function (p) { bloque.appendChild(tarjetaPropuesta(p, false)); });
        const area = elemento('textarea');
        area.name = c.clave;
        area.rows = c.lista ? 4 : 3;
        const valor = datos.derivados[c.clave];
        area.value = derivadosEscritos[c.clave] !== undefined ? derivadosEscritos[c.clave] : (Array.isArray(valor) ? valor.join('\n') : valor);
        area.readOnly = !datos.puedeEditar;
        area.placeholder = c.lista ? 'Un renglón por elemento' : 'Escríbelo aquí';
        area.addEventListener('input', function () {
          derivadosEscritos[c.clave] = area.value;
          q('guardado-derivados').textContent = 'Sin guardar…';
          clearTimeout(temporizadores.derivados);
          temporizadores.derivados = setTimeout(guardarDerivadosSolos, 2000);
        });
        bloque.appendChild(area);
        q('derivados').appendChild(bloque);
      });
      if (Object.keys(derivadosEscritos).length) q('guardado-derivados').textContent = 'Sin guardar…';

      /* Lo ya decidido, para consulta. */
      const decididas = datos.propuestas.filter(function (p) { return p.decision !== 'PENDIENTE'; });
      if (decididas.length) {
        q('seccion-decididas').hidden = false;
        q('titulo-decididas').textContent = 'Ya decidiste ' + decididas.length + (decididas.length === 1 ? ' propuesta' : ' propuestas');
        decididas.forEach(function (p) {
          const fila = elemento('div', 'decidida');
          fila.appendChild(elemento('span', 'chip ' + (p.decision === 'RECHAZADA' ? '' : 'exito'), NOMBRES_DECISION[p.decision] || p.decision));
          fila.appendChild(elemento('span', '', (p.numero ? 'Actividad ' + p.numero + ' · ' : '') + (NOMBRES_CAMPO_PROPUESTA[p.campo] || p.campo)));
          q('decididas').appendChild(fila);
        });
      }

      /* Continuar: las preguntas son obligatorias. */
      if (datos.puedeEditar && faltan) q('nota-siguiente').textContent = 'Antes responde las preguntas pendientes (o elige «No aplica» / «No lo sé»).';
      ui.querySelector('[data-accion="ir-vista"]').addEventListener('click', function () {
        const faltantes = datos.puedeEditar ? preguntasPendientes() : [];
        if (faltantes.length) {
          avisar(faltantes.length === 1 ? 'Falta responder 1 pregunta (puede ser «No aplica» o «No lo sé»).'
            : 'Faltan ' + faltantes.length + ' preguntas por responder (pueden ser «No aplica» o «No lo sé»).', 'error');
          const card = ui.querySelector('.pregunta[data-pregunta="' + faltantes[0].id + '"]');
          resaltar(card, card && card.querySelector('textarea'));
          return;
        }
        ir('solicitud', true, idSolicitud + ':vista');
      });
      pintarIconos();
    }

    /*
     * Lanza el trabajo y, si no contesta en reintentoIa.esperaSegundos (o falla), el mismo con el
     * siguiente modelo en paralelo, hasta reintentoIa.intentos. Se queda con el primero que conteste; el
     * servidor solo deja escribir a uno de la misma corrida.
     */
    function correrEnParalelo(operacion, alLanzarOtro) {
      const cfg = datos.reintentoIa || { esperaSegundos: 40, intentos: 1 };
      const corrida = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      return new Promise(function (resolver, rechazar) {
        let lanzados = 0;
        let enCurso = 0;
        let terminado = false;
        let temporizador = null;
        const errores = [];
        function siguiente() {
          clearTimeout(temporizador);
          if (terminado || lanzados >= cfg.intentos) return;
          const intento = lanzados++;
          enCurso++;
          if (intento > 0) alLanzarOtro(intento + 1);
          llamar('apiAnalizar', idSolicitud, operacion, intento, corrida).then(function (r) {
            enCurso--;
            if (terminado) return;
            if (r && r.descartado) {
              /* Otro intento de esta corrida ya escribió; si era el último en curso, se da por terminado. */
              if (!enCurso && lanzados >= cfg.intentos) { terminado = true; resolver({ operacion: operacion, sinDetalle: true }); }
              return;
            }
            terminado = true;
            clearTimeout(temporizador);
            resolver(r);
          }, function (e) {
            enCurso--;
            errores.push(e.message);
            if (terminado) return;
            if (lanzados < cfg.intentos) siguiente();
            else if (!enCurso) { terminado = true; rechazar(new Error(errores[errores.length - 1])); }
          });
          temporizador = setTimeout(siguiente, cfg.esperaSegundos * 1000);
        }
        siguiente();
      });
    }

    /* Corre el trabajo con un reloj a la vista; el resultado (o el error) se queda en pantalla. */
    function analizarAhora(operacion) {
      const inicio = Date.now();
      ocupadoIa = true;
      resultadoIa = null;
      q('resultado-ia').hidden = true;
      q('analizando').hidden = false;
      textosIa = { titulo: operacion === 'REDACCION' ? 'Corrigiendo la redacción…' : 'Analizando tu proceso…',
        nota: operacion === 'REDACCION' ? 'Suele tardar unos segundos. Mientras, puedes seguir respondiendo y revisando.'
          : 'Suele tardar menos de un minuto. Mientras, puedes seguir respondiendo y revisando.' };
      q('analizando-titulo').textContent = textosIa.titulo;
      q('analizando-nota').textContent = textosIa.nota;
      ui.querySelectorAll('[data-accion="redaccion"], [data-accion="analizar"]').forEach(function (b) { b.disabled = true; });
      const reloj = setInterval(function () {
        const t = ui && q('analizando-tiempo');
        if (t) t.textContent = Math.round((Date.now() - inicio) / 1000) + ' s';
      }, 1000);
      /* Primero se guarda lo escrito (la redacción usa las respuestas) y se espera lo que iba en camino. */
      guardarPendientes();
      return colaServidor.then(function () {
        return correrEnParalelo(operacion, function (n) {
          textosIa.nota = 'La IA está tardando: se le pidió también a otro modelo (' + n + ' a la vez) y se usará el primero que conteste.';
          const nota = ui && q('analizando-nota');
          if (nota) nota.textContent = textosIa.nota;
        });
      }).then(function (r) {
        avisosIa = r.avisos || [];
        resultadoIa = Object.assign({ ok: true }, r);
        delete resultadoIa.paso4;
        ocupadoIa = false;
        if (!contenido.isConnected) return;
        if (r.paso4 && !enCola) mostrar(r.paso4);
        else return recargar();
      }, function (e) {
        resultadoIa = { error: e.message };
        ocupadoIa = false;
        if (contenido.isConnected) return recargar().catch(function () { mostrar(datos); });
      }).then(function () {
        clearInterval(reloj);
        if (ui && !q('resultado-ia').hidden) q('resultado-ia').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function pintarResultado() {
      const r = resultadoIa;
      const caja = q('resultado-ia');
      caja.hidden = !r;
      if (!r) return;
      caja.classList.toggle('error', !!r.error);
      q('resultado-icono').setAttribute('data-lucide', r.error ? 'triangle-alert' : 'sparkles');
      if (r.error) {
        q('resultado-titulo').textContent = 'La IA no pudo terminar';
        q('resultado-texto').textContent = r.error + ' Intenta de nuevo en un momento; mientras, todo se puede escribir a mano.';
        return;
      }
      const tiempo = r.segundos !== undefined ? ' Respondió en ' + r.segundos + ' s' + (r.modelo ? ' (' + r.modelo + ')' : '') + '.' : '';
      if (r.sinDetalle) {
        q('resultado-titulo').textContent = 'La IA terminó.';
        q('resultado-texto').textContent = 'Revisa abajo lo que propone; nada cambia hasta que lo aceptes.';
      } else if (r.operacion === 'REDACCION') {
        q('resultado-titulo').textContent = r.redaccion
          ? 'La IA propone corregir la redacción de ' + r.redaccion + (r.redaccion === 1 ? ' actividad.' : ' actividades.')
          : 'La IA no encontró nada que corregir en la redacción.';
        q('resultado-texto').textContent = (r.redaccion ? 'Revísalas abajo y acéptalas una por una o todas de una vez. ' : '') +
          'Después puedes usar «Analizar con IA» para los responsables, el objetivo y el alcance.' + tiempo;
      } else {
        q('resultado-titulo').textContent = 'La IA terminó el análisis: ' + r.propuestas + (r.propuestas === 1 ? ' propuesta' : ' propuestas') +
          ' y ' + r.preguntas + (r.preguntas === 1 ? ' pregunta.' : ' preguntas.');
        q('resultado-texto').textContent = 'Responsables, objetivo, alcance y lo demás están abajo; nada cambia hasta que lo aceptes.' + tiempo;
      }
    }

    /* Al salir: lo escrito se manda y la pantalla nueva espera a que todo lo que iba en camino termine. */
    estado.alSalir = function () {
      if (datos) guardarPendientes();
      return enCola ? colaServidor : null;
    };

    /* Arranca solo: lo que pidió el paso 3 y, si nunca se ha hecho, el análisis completo. */
    function arrancarSolo() {
      if (!ui || !datos.puedeEditar || !datos.iaActiva) return;
      const pedido = estado.analizarAlAbrir && estado.analizarAlAbrir.id === idSolicitud ? estado.analizarAlAbrir.operacion : '';
      estado.analizarAlAbrir = null;
      let cadena = pedido ? analizarAhora(pedido) : Promise.resolve();
      if (pedido !== 'ANALISIS') {
        cadena.then(function () { if (contenido.isConnected && datos && !datos.analizado && !ocupadoIa) return analizarAhora('ANALISIS'); });
      }
    }

    /* Lo que pidió la vista previa o una observación: llevar la vista a ese campo. */
    function enfocarPedido() {
      const e = tomarEnfoque(idSolicitud);
      if (!e || !ui) return;
      const apartado = e.apartado === 'RESPONSABILIDADES' ? 'PUESTOS' : e.apartado;
      const bloque = ui.querySelector('.derivado[data-apartado="' + apartado + '"]');
      if (bloque) resaltar(bloque, bloque.querySelector('textarea'));
    }

    cargarConMemoria('analisis:' + idSolicitud, function () { return llamar('apiAnalisis', idSolicitud); }, function (d, memoria, igual) {
      if (!contenido.isConnected) return;
      if (memoria) { mostrar(d); return; }
      if (!igual && !enCola) mostrar(d);
      enfocarPedido();
      arrancarSolo();
    }).catch(function (e) {
      if (!contenido.isConnected) return;
      contenido.textContent = '';
      const t = elemento('div', 'tarjeta');
      t.appendChild(estadoVacio('triangle-alert', 'No se pudo abrir el análisis', e.message));
      contenido.appendChild(t);
      pintarIconos();
    });
  }
</script>
