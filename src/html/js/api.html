<script>
  /*
   * api — llama al servidor (ClientApi.gs) con promesas, para usar async / await.
   * Siempre manda primero `comoUsuario` (vacío = la persona real), que el servidor vuelve a validar.
   */
  function llamar(funcion) {
    const argumentos = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolver, rechazar) {
      const corredor = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (e) { rechazar(new Error((e && e.message) || String(e))); });
      corredor[funcion].apply(corredor, [estado.comoUsuario || ''].concat(argumentos));
    });
  }
</script>
