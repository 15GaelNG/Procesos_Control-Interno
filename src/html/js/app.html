<script>
  /*
   * app — arranque, menú, tema, «ver como» y navegación entre pantallas (una sola página).
   *
   * Las pantallas que ve cada quien las decide el servidor (MODULOS_APP en Catalogos.gs, según sus
   * perfiles) y llegan en DATOS.modulos; aquí solo se pintan.
   *
   * Ojo, reglas de los .html de Apps Script (ver CLAUDE.md): aquí los comentarios van con barra-asterisco,
   * ninguna URL dentro del JS, y nada de barra-asterisco dentro de un texto.
   */

  const estado = {
    vista: 'inicio',
    parametro: '',
    sesion: DATOS.sesion,
    modulos: DATOS.modulos,
    comoUsuario: '',
    alSalir: null      /* La pantalla abierta puede dejar aquí qué hacer antes de cambiar (p. ej. guardar). */
  };

  /* Pantallas que piden datos al servidor al abrirse: id del módulo → función(contenedor, parámetro). */
  const PANTALLAS = {
    'mis-solicitudes': iniciarMisSolicitudes,
    nueva: iniciarNuevaSolicitud,
    revision: iniciarBandeja,
    'envios-ch': iniciarEnviosCH,
    inventario: iniciarInventario,
    catalogos: iniciarCatalogos,
    usuarios: iniciarUsuarios,
    bitacora: iniciarBitacora
  };

  /* ─────────── Utilidades ─────────── */
  function $(selector, raiz) { return (raiz || document).querySelector(selector); }
  function guardar(clave, valor) { try { localStorage.setItem('procesos.' + clave, valor); } catch (e) { /* sin almacenamiento */ } }
  function leer(clave) { try { return localStorage.getItem('procesos.' + clave); } catch (e) { return null; } }
  function guardarPestana(clave, valor) { try { sessionStorage.setItem('procesos.' + clave, valor); } catch (e) { /* sin almacenamiento */ } }
  function leerPestana(clave) { try { return sessionStorage.getItem('procesos.' + clave); } catch (e) { return null; } }
  function pintarIconos() { if (window.lucide) lucide.createIcons(); }
  function clonar(idPlantilla) { return document.getElementById(idPlantilla).content.cloneNode(true); }
  function modulo(id) { return estado.modulos.filter(function (m) { return m.id === id; })[0]; }
  function nombresPerfiles(perfiles) {
    return perfiles.map(function (p) { return DATOS.nombresPerfil[p] || p; }).join(' · ');
  }
  function iniciales(nombre) {
    const partes = String(nombre || '').replace(/@.*$/, '').replace(/\(.*\)/, '').split(/[\s._-]+/).filter(Boolean);
    return ((partes[0] || '?').charAt(0) + (partes[1] || '').charAt(0)).toUpperCase();
  }
  /* Aviso flotante que se quita solo (tipo: 'exito' o 'error'). */
  function avisar(texto, tipo) {
    const aviso = document.createElement('div');
    aviso.className = 'aviso-flotante ' + (tipo || '');
    aviso.textContent = texto;
    $('#avisos').appendChild(aviso);
    setTimeout(function () { aviso.classList.add('saliendo'); }, 3500);
    setTimeout(function () { aviso.remove(); }, 4000);
  }
  function primerNombre(nombre) {
    const texto = String(nombre || '');
    return texto.indexOf('@') !== -1 ? '' : texto.split(' ')[0];
  }

  /* ─────────── Tema claro / oscuro ─────────── */
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-theme', tema);
    document.querySelectorAll('.btn-tema').forEach(function (b) { b.classList.toggle('activo', b.dataset.tema === tema); });
  }
  function temaInicial() {
    const guardado = leer('tema');
    if (guardado === 'light' || guardado === 'dark') return guardado;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  /* ─────────── Menú ─────────── */
  function pintarMenu() {
    const contenedor = $('#menu-opciones');
    contenedor.textContent = '';
    let seccion = '';
    estado.modulos.forEach(function (m) {
      if (m.seccion && m.seccion !== seccion) {
        seccion = m.seccion;
        const s = document.createElement('div');
        s.className = 'menu-seccion';
        s.textContent = m.seccion;
        contenedor.appendChild(s);
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opcion';
      b.dataset.vista = m.id;
      b.title = m.nombre;
      const i = document.createElement('i');
      i.setAttribute('data-lucide', m.icono);
      i.className = 'ico';
      const t = document.createElement('span');
      t.className = 'menu-texto';
      t.textContent = m.nombre;
      b.appendChild(i);
      b.appendChild(t);
      if (m.fase) {
        const p = document.createElement('span');
        p.className = 'pronto';
        p.textContent = 'Pronto';
        b.appendChild(p);
      }
      b.addEventListener('click', function () { ir(m.id, true); });
      contenedor.appendChild(b);
    });
  }

  function abrirMenuMovil(abrir) {
    $('#menu').classList.toggle('abierto', abrir);
    $('#menu-fondo').hidden = !abrir;
  }

  /* ─────────── Navegación ─────────── */
  function ir(id, guardarHistorial, parametro) {
    if (estado.alSalir) {
      const salir = estado.alSalir;
      estado.alSalir = null;
      let pendiente = null;
      try { pendiente = salir(); } catch (e) { /* que no impida cambiar de pantalla */ }
      /* Si la pantalla tiene algo guardándose, se espera a que termine antes de cambiar. */
      if (pendiente && typeof pendiente.then === 'function') {
        const seguir = function () { ir(id, guardarHistorial, parametro); };
        pendiente.then(seguir, seguir);
        return;
      }
    }
    if (id === 'solicitud' && parametro) { abrirSolicitud(parametro, guardarHistorial); return; }
    const m = modulo(id) || modulo('inicio');
    estado.vista = m.id;
    estado.parametro = '';
    document.querySelectorAll('.opcion').forEach(function (b) { b.classList.toggle('activa', b.dataset.vista === m.id); });
    const vista = $('#vista');
    vista.textContent = '';
    vista.appendChild(construirVista(m));
    vista.scrollTop = 0;
    pintarIconos();
    if (!m.fase && PANTALLAS[m.id]) PANTALLAS[m.id](vista);
    abrirMenuMovil(false);
    if (guardarHistorial && window.google && google.script && google.script.history) {
      google.script.history.push({ vista: m.id }, { vista: m.id });
    }
  }

  /* Una solicitud (captura, análisis, vista previa o revisión de Procesos). No está en el menú: se
     llega desde «Mis solicitudes», desde la bandeja o con ?vista=solicitud&id=SOL-2026-0001:analisis.
     El parámetro es «folio:paso» (desarrollo, analisis, vista o revision; sin paso, desarrollo).
     El servidor decide si se puede ver o editar. */
  const PASOS_SOLICITUD = { desarrollo: 'iniciarEditor', analisis: 'iniciarAnalisis', vista: 'iniciarVistaPrevia', revision: 'iniciarRevision' };
  function abrirSolicitud(parametro, guardarHistorial) {
    const partes = String(parametro).split(':');
    const idSolicitud = partes[0];
    const paso = PASOS_SOLICITUD[partes[1]] ? partes[1] : 'desarrollo';
    estado.vista = 'solicitud';
    estado.parametro = idSolicitud + ':' + paso;
    /* La revisión de Procesos sale de la bandeja; los pasos del colaborador, de «Mis solicitudes». */
    const deProcesos = paso === 'revision';
    const origen = deProcesos ? 'revision' : 'mis-solicitudes';
    document.querySelectorAll('.opcion').forEach(function (b) { b.classList.toggle('activa', b.dataset.vista === origen); });
    const vista = $('#vista');
    vista.textContent = '';
    vista.appendChild(clonar('vista-solicitud'));
    vista.scrollTop = 0;
    const destino = modulo(origen) ? origen : 'inicio';
    const volver = vista.querySelector('[data-accion="volver"]');
    volver.lastChild.textContent = destino === 'inicio' ? 'Inicio' : modulo(destino).nombre;
    volver.addEventListener('click', function () { ir(destino, true); });
    vista.querySelector('.pasos-captura').hidden = deProcesos;
    vista.querySelectorAll('[data-paso]').forEach(function (b) {
      b.classList.toggle('actual', b.dataset.paso === paso);
      b.addEventListener('click', function () { if (b.dataset.paso !== paso) ir('solicitud', true, idSolicitud + ':' + b.dataset.paso); });
    });
    pintarIconos();
    window[PASOS_SOLICITUD[paso]](vista, idSolicitud);
    abrirMenuMovil(false);
    if (guardarHistorial && window.google && google.script && google.script.history) {
      google.script.history.push({ vista: 'solicitud', id: estado.parametro }, { vista: 'solicitud', id: estado.parametro });
    }
  }

  function construirVista(m) {
    if (m.id === 'inicio') return vistaInicio();
    if (!m.fase && document.getElementById('vista-' + m.id)) return clonar('vista-' + m.id);
    const f = clonar('vista-en-construccion');
    $('[data-campo="icono"]', f).setAttribute('data-lucide', m.icono);
    $('[data-campo="titulo"]', f).textContent = m.nombre;
    $('[data-campo="descripcion"]', f).textContent = m.descripcion || '';
    $('[data-campo="fase"]', f).textContent = 'Esta pantalla llega en ' + m.fase + '.';
    const lista = $('[data-campo="acciones"]', f);
    (m.acciones || []).forEach(function (a) {
      const li = document.createElement('li');
      li.innerHTML = '<i data-lucide="check" class="ico"></i><span></span>';
      $('span', li).textContent = a;
      lista.appendChild(li);
    });
    $('[data-campo="bloque-acciones"]', f).hidden = !(m.acciones || []).length;
    return f;
  }

  function vistaInicio() {
    const f = clonar('vista-inicio');
    const nombre = primerNombre(estado.sesion.nombre);
    $('[data-campo="saludo"]', f).textContent = nombre ? '¡Hola, ' + nombre + '!' : '¡Hola!';
    const chips = $('[data-campo="perfiles"]', f);
    estado.sesion.perfiles.forEach(function (p) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = DATOS.nombresPerfil[p] || p;
      chips.appendChild(c);
    });
    const accesos = $('[data-campo="accesos"]', f);
    const disponibles = estado.modulos.filter(function (m) { return m.id !== 'inicio'; });
    disponibles.forEach(function (m) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'acceso';
      b.innerHTML = '<span class="acceso-icono"><i class="ico"></i></span>' +
        '<span class="acceso-texto"><strong></strong><span class="acceso-desc"></span><span class="chip"></span></span>';
      $('i', b).setAttribute('data-lucide', m.icono);
      $('strong', b).textContent = m.nombre;
      $('.acceso-desc', b).textContent = m.descripcion || '';
      const chip = $('.chip', b);
      chip.classList.add(m.fase ? 'dorado' : 'exito');
      chip.textContent = m.fase ? 'Llega en ' + m.fase : 'Disponible';
      b.addEventListener('click', function () { ir(m.id, true); });
      accesos.appendChild(b);
    });
    $('[data-campo="sin-accesos"]', f).hidden = disponibles.length > 0;
    return f;
  }

  /* ─────────── Usuario, aviso del ambiente y «ver como» ─────────── */
  function pintarUsuario() {
    const s = estado.sesion;
    $('#usuario-nombre').textContent = s.nombre;
    $('#usuario-perfiles').textContent = nombresPerfiles(s.perfiles) || 'Sin perfil asignado';
    $('#usuario-iniciales').textContent = iniciales(s.nombre);
    const aviso = $('#aviso-ambiente');
    if (DATOS.ambiente === 'PRODUCCION') return;
    $('#aviso-texto').textContent = s.verComo
      ? 'Pruebas · viendo como ' + s.nombre + ' · ' + (nombresPerfiles(s.perfiles) || 'sin perfil')
      : 'Ambiente de ' + DATOS.ambiente + ' · los datos no son reales';
    $('#btn-volver-yo').hidden = !s.verComo;
    aviso.classList.toggle('viendo-como', !!s.verComo);
    aviso.hidden = false;
    document.body.classList.add('con-aviso');
  }

  function prepararVerComo() {
    if (!DATOS.verComo.length) return;
    const lista = $('#ver-como-lista');
    const yo = DATOS.verComo.filter(function (u) { return u.idUsuario === DATOS.sesion.idUsuario; });
    const otros = DATOS.verComo.filter(function (u) { return u.idUsuario !== DATOS.sesion.idUsuario; });
    yo.concat(otros).forEach(function (u) {
      const o = document.createElement('option');
      o.value = u.idUsuario === DATOS.sesion.idUsuario ? '' : u.idUsuario;
      o.textContent = (o.value ? u.nombre : 'Yo · ' + u.nombre) + ' — ' + (nombresPerfiles(u.perfiles) || 'sin perfil');
      lista.appendChild(o);
    });
    lista.value = '';
    lista.addEventListener('change', function () { verComo(lista.value); });
    $('#btn-volver-yo').addEventListener('click', function () { verComo(''); });
    $('#ver-como').hidden = false;
  }

  /* El servidor valida el cambio (apiSesion → sesionEfectiva_) y devuelve la sesión y sus pantallas. */
  function verComo(idUsuario) {
    const lista = $('#ver-como-lista');
    const anterior = estado.comoUsuario;
    lista.disabled = true;
    estado.comoUsuario = idUsuario;
    return llamar('apiSesion').then(function (r) {
      estado.sesion = r.sesion;
      estado.modulos = r.modulos;
      guardarPestana('verComo', idUsuario);
      pintarUsuario();
      pintarMenu();
      if (estado.vista === 'solicitud') ir('solicitud', false, estado.parametro);
      else ir(modulo(estado.vista) ? estado.vista : 'inicio', false);
    }).catch(function (e) {
      estado.comoUsuario = anterior;
      guardarPestana('verComo', anterior);
      alert('No se pudo cambiar de usuario: ' + e.message);
    }).then(function () {
      lista.value = estado.comoUsuario;
      lista.disabled = false;
    });
  }

  /* ─────────── Sin acceso ─────────── */
  function mostrarSinAcceso() {
    const pantalla = $('#sin-acceso');
    const f = clonar('vista-sin-acceso');
    const correo = DATOS.sesion.correo;
    if (DATOS.error) {
      $('[data-campo="titulo"]', f).textContent = 'No se pudo abrir el sistema';
      $('[data-campo="mensaje"]', f).textContent = DATOS.error;
    } else {
      $('[data-campo="mensaje"]', f).textContent = correo
        ? 'Tu cuenta ' + correo + ' aún no está dada de alta. Pide al área de Procesos que te registre y vuelve a intentarlo.'
        : 'No se pudo identificar tu cuenta de Google. Entra con tu correo de Ciudad Maderas.';
    }
    $('[data-accion="reintentar"]', f).addEventListener('click', function () {
      if (DATOS.urlApp) window.open(DATOS.urlApp, '_top');
    });
    pantalla.appendChild(f);
    pantalla.hidden = false;
    pintarIconos();
  }

  /* ─────────── Arranque ─────────── */
  function arrancar() {
    aplicarTema(temaInicial());
    document.querySelectorAll('.btn-tema').forEach(function (b) {
      b.addEventListener('click', function () { aplicarTema(b.dataset.tema); guardar('tema', b.dataset.tema); });
    });

    if (!DATOS.sesion.registrado) { pintarUsuarioSinAcceso(); mostrarSinAcceso(); return; }

    pintarUsuario();
    prepararVerComo();
    const hoy = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('#barra-fecha').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);

    pintarMenu();
    if (leer('menuColapsado') === 'SI') $('#menu').classList.add('colapsado');
    $('#btn-colapsar').addEventListener('click', function () {
      const colapsado = $('#menu').classList.toggle('colapsado');
      guardar('menuColapsado', colapsado ? 'SI' : 'NO');
    });
    $('#btn-menu-movil').addEventListener('click', function () { abrirMenuMovil(true); });
    $('#menu-fondo').addEventListener('click', function () { abrirMenuMovil(false); });

    $('#app').hidden = false;

    /* Atrás / adelante del navegador, y abrir directo una pantalla con ?vista=... */
    const abrirInicial = function (id, parametro) {
      ir(id, false, parametro);
      const guardado = leerPestana('verComo');
      if (guardado && DATOS.verComo.length) verComo(guardado);
    };
    if (window.google && google.script) {
      google.script.history.setChangeHandler(function (e) { ir((e.state && e.state.vista) || 'inicio', false, e.state && e.state.id); });
      google.script.url.getLocation(function (ubicacion) { abrirInicial(ubicacion.parameter.vista || 'inicio', ubicacion.parameter.id); });
    } else {
      abrirInicial('inicio');
    }
  }

  /* Quien no está dado de alta solo ve el aviso del ambiente (si es de pruebas). */
  function pintarUsuarioSinAcceso() {
    if (DATOS.ambiente === 'PRODUCCION') return;
    $('#aviso-texto').textContent = 'Ambiente de ' + DATOS.ambiente + ' · los datos no son reales';
    $('#aviso-ambiente').hidden = false;
  }

  arrancar();
</script>
