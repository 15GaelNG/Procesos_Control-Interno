<script>
  /*
   * app — arranque, menú, tema y navegación entre pantallas (una sola página).
   *
   * Ojo, reglas de los .html de Apps Script (ver CLAUDE.md): aquí los comentarios van con barra-asterisco,
   * ninguna URL dentro del JS, y nada de barra-asterisco dentro de un texto.
   */

  /* Opciones del menú. `fase` = cuándo llega la pantalla; sin `fase`, ya existe. Los permisos por
     perfil se agregan en el punto 2 de la fase 1. */
  const MODULOS = [
    { id: 'inicio', nombre: 'Inicio', icono: 'house' },
    { seccion: 'Documentar' },
    { id: 'mis-solicitudes', nombre: 'Mis solicitudes', icono: 'folder-open',
      descripcion: 'Tus documentos en elaboración y en qué etapa va cada uno.' },
    { id: 'nueva', nombre: 'Nueva solicitud', icono: 'file-plus-2', fase: 'la fase 2',
      descripcion: 'Documenta un proceso nuevo o actualiza uno vigente, actividad por actividad.' },
    { seccion: 'Área de Procesos' },
    { id: 'revision', nombre: 'Bandeja de revisión', icono: 'clipboard-check', fase: 'la fase 5',
      descripcion: 'Revisar, hacer observaciones, asignar código y dar el Vo.Bo.' },
    { id: 'envios-ch', nombre: 'Envíos a CH', icono: 'send', fase: 'la fase 6',
      descripcion: 'Archivos para subir al sistema CH y registro de su resultado.' },
    { id: 'inventario', nombre: 'Inventario documental', icono: 'library', fase: 'la fase 6',
      descripcion: 'Documentos vigentes, su versión y su historial de cambios.' },
    { seccion: 'Administración' },
    { id: 'usuarios', nombre: 'Usuarios y perfiles', icono: 'users', fase: 'esta fase (fase 1)',
      descripcion: 'Quién entra al sistema y con qué perfil.' },
    { id: 'catalogos', nombre: 'Catálogos', icono: 'list-tree', fase: 'esta fase (fase 1)',
      descripcion: 'Departamentos, áreas, puestos y tipos de documento.' }
  ];

  const estado = { vista: 'inicio' };

  /* ─────────── Utilidades ─────────── */
  function $(selector, raiz) { return (raiz || document).querySelector(selector); }
  function guardar(clave, valor) { try { localStorage.setItem('procesos.' + clave, valor); } catch (e) { /* sin almacenamiento */ } }
  function leer(clave) { try { return localStorage.getItem('procesos.' + clave); } catch (e) { return null; } }
  function pintarIconos() { if (window.lucide) lucide.createIcons(); }
  function clonar(idPlantilla) { return document.getElementById(idPlantilla).content.cloneNode(true); }
  function modulo(id) { return MODULOS.filter(function (m) { return m.id === id; })[0]; }
  function iniciales(nombre) {
    const partes = String(nombre || '').replace(/@.*$/, '').split(/[\s._-]+/).filter(Boolean);
    return ((partes[0] || '?').charAt(0) + (partes[1] || '').charAt(0)).toUpperCase();
  }
  function primerNombre(nombre) {
    const texto = String(nombre || '');
    return texto.indexOf('@') !== -1 ? '' : texto.split(' ')[0];
  }

  /* ─────────── Tema claro / oscuro ─────────── */
  function aplicarTema(tema) {
    document.documentElement.setAttribute('data-theme', tema);
    document.querySelectorAll('.btn-tema').forEach(function (b) { b.classList.toggle('activo', b.dataset.tema === tema); });
  }
  function temaInicial() {
    const guardado = leer('tema');
    if (guardado === 'light' || guardado === 'dark') return guardado;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  /* ─────────── Menú ─────────── */
  function pintarMenu() {
    const contenedor = $('#menu-opciones');
    contenedor.textContent = '';
    MODULOS.forEach(function (m) {
      if (m.seccion) {
        const s = document.createElement('div');
        s.className = 'menu-seccion';
        s.textContent = m.seccion;
        contenedor.appendChild(s);
        return;
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opcion';
      b.dataset.vista = m.id;
      b.title = m.nombre;
      const i = document.createElement('i');
      i.setAttribute('data-lucide', m.icono);
      i.className = 'ico';
      const t = document.createElement('span');
      t.className = 'menu-texto';
      t.textContent = m.nombre;
      b.appendChild(i);
      b.appendChild(t);
      if (m.fase) {
        const p = document.createElement('span');
        p.className = 'pronto';
        p.textContent = 'Pronto';
        b.appendChild(p);
      }
      b.addEventListener('click', function () { ir(m.id, true); });
      contenedor.appendChild(b);
    });
  }

  function abrirMenuMovil(abrir) {
    $('#menu').classList.toggle('abierto', abrir);
    $('#menu-fondo').hidden = !abrir;
  }

  /* ─────────── Navegación ─────────── */
  function ir(id, guardarHistorial) {
    const m = modulo(id) || modulo('inicio');
    estado.vista = m.id;
    document.querySelectorAll('.opcion').forEach(function (b) { b.classList.toggle('activa', b.dataset.vista === m.id); });
    const vista = $('#vista');
    vista.textContent = '';
    vista.appendChild(construirVista(m));
    vista.scrollTop = 0;
    pintarIconos();
    abrirMenuMovil(false);
    if (guardarHistorial && window.google && google.script && google.script.history) {
      google.script.history.push({ vista: m.id }, { vista: m.id });
    }
  }

  function construirVista(m) {
    if (m.id === 'inicio') return vistaInicio();
    if (!m.fase && document.getElementById('vista-' + m.id)) return clonar('vista-' + m.id);
    const f = clonar('vista-en-construccion');
    $('[data-campo="icono"]', f).setAttribute('data-lucide', m.icono);
    $('[data-campo="titulo"]', f).textContent = m.nombre;
    $('[data-campo="descripcion"]', f).textContent = m.descripcion || '';
    $('[data-campo="fase"]', f).textContent = 'Esta pantalla llega en ' + m.fase + '. Mientras tanto puedes ver cómo va quedando el resto del sistema.';
    return f;
  }

  function vistaInicio() {
    const f = clonar('vista-inicio');
    const nombre = primerNombre(DATOS.sesion.nombre);
    $('[data-campo="saludo"]', f).textContent = nombre ? '¡Hola, ' + nombre + '!' : '¡Hola!';
    const chips = $('[data-campo="perfiles"]', f);
    DATOS.sesion.perfiles.forEach(function (p) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = DATOS.nombresPerfil[p] || p;
      chips.appendChild(c);
    });
    const accesos = $('[data-campo="accesos"]', f);
    MODULOS.filter(function (m) { return m.id && m.id !== 'inicio'; }).forEach(function (m) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'acceso';
      b.innerHTML = '<span class="acceso-icono"><i class="ico"></i></span><div><strong></strong><span></span></div>';
      $('i', b).setAttribute('data-lucide', m.icono);
      $('strong', b).textContent = m.nombre;
      $('div span', b).textContent = m.descripcion || '';
      const chip = document.createElement('span');
      chip.className = m.fase ? 'chip dorado' : 'chip exito';
      chip.textContent = m.fase ? 'Llega en ' + m.fase : 'Disponible';
      $('div', b).appendChild(chip);
      b.addEventListener('click', function () { ir(m.id, true); });
      accesos.appendChild(b);
    });
    return f;
  }

  /* ─────────── Sin acceso ─────────── */
  function mostrarSinAcceso() {
    const pantalla = $('#sin-acceso');
    const f = clonar('vista-sin-acceso');
    const correo = DATOS.sesion.correo;
    if (DATOS.error) {
      $('[data-campo="titulo"]', f).textContent = 'No se pudo abrir el sistema';
      $('[data-campo="mensaje"]', f).textContent = DATOS.error;
    } else {
      $('[data-campo="mensaje"]', f).textContent = correo
        ? 'Tu cuenta ' + correo + ' aún no está dada de alta. Pide al área de Procesos que te registre y vuelve a intentarlo.'
        : 'No se pudo identificar tu cuenta de Google. Entra con tu correo de Ciudad Maderas.';
    }
    $('[data-accion="reintentar"]', f).addEventListener('click', function () {
      if (DATOS.urlApp) window.open(DATOS.urlApp, '_top');
    });
    pantalla.appendChild(f);
    pantalla.hidden = false;
    pintarIconos();
  }

  /* ─────────── Arranque ─────────── */
  function arrancar() {
    aplicarTema(temaInicial());
    document.querySelectorAll('.btn-tema').forEach(function (b) {
      b.addEventListener('click', function () { aplicarTema(b.dataset.tema); guardar('tema', b.dataset.tema); });
    });

    if (DATOS.ambiente !== 'PRODUCCION') {
      const aviso = $('#aviso-ambiente');
      aviso.textContent = 'Ambiente de ' + DATOS.ambiente + ' · los datos no son reales';
      aviso.hidden = false;
      document.body.classList.add('con-aviso');
    }

    if (!DATOS.sesion.registrado) { mostrarSinAcceso(); return; }

    $('#usuario-nombre').textContent = DATOS.sesion.nombre;
    $('#usuario-perfiles').textContent = DATOS.sesion.perfiles
      .map(function (p) { return DATOS.nombresPerfil[p] || p; }).join(' · ') || 'Sin perfil asignado';
    $('#usuario-iniciales').textContent = iniciales(DATOS.sesion.nombre);
    const hoy = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('#barra-fecha').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);

    pintarMenu();
    if (leer('menuColapsado') === 'SI') $('#menu').classList.add('colapsado');
    $('#btn-colapsar').addEventListener('click', function () {
      const colapsado = $('#menu').classList.toggle('colapsado');
      guardar('menuColapsado', colapsado ? 'SI' : 'NO');
    });
    $('#btn-menu-movil').addEventListener('click', function () { abrirMenuMovil(true); });
    $('#menu-fondo').addEventListener('click', function () { abrirMenuMovil(false); });

    $('#app').hidden = false;

    /* Atrás / adelante del navegador, y abrir directo una pantalla con ?vista=... */
    if (window.google && google.script) {
      google.script.history.setChangeHandler(function (e) { ir((e.state && e.state.vista) || 'inicio', false); });
      google.script.url.getLocation(function (ubicacion) { ir(ubicacion.parameter.vista || 'inicio', false); });
    } else {
      ir('inicio', false);
    }
  }

  arrancar();
</script>
