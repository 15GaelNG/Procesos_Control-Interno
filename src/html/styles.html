<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Colores de SIVET y Control Interno (azul marino y dorado de Ciudad Maderas). El menú lateral es
     azul marino en los dos temas; lo demás cambia con claro / oscuro. */
  :root {
    --primario: #06263A;
    --primario-hover: #0c3550;
    --primario-suave: #DDEBF7;
    --dorado: #B4A169;
    --dorado-hover: #9c8a58;
    --dorado-suave: #EBE5D1;

    --fondo: #F5F6F5;
    --superficie: #ffffff;
    --texto: #1c2b33;
    --texto-suave: #5c6b72;
    --borde: #E7E7E7;
    --exito: #1e7d4f;
    --exito-suave: #dcefe5;
    --aviso: #8a6d3a;

    --menu-fondo: #06263A;
    --menu-texto: #b7c8d2;
    --menu-texto-fuerte: #ffffff;
    --menu-hover: rgba(255,255,255,.08);
    --menu-borde: rgba(255,255,255,.14);

    --radio: 12px;
    --sombra: 0 1px 3px rgba(6,38,58,.08), 0 1px 2px rgba(6,38,58,.05);
    --sombra-grande: 0 24px 48px -16px rgba(6,38,58,.35);
  }

  :root[data-theme="dark"] {
    --primario: #2f7bb0;
    --primario-hover: #3f91cb;
    --primario-suave: #163041;
    --dorado: #c4b280;
    --dorado-hover: #d4c393;
    --dorado-suave: #2a2718;

    --fondo: #0b1a23;
    --superficie: #142732;
    --texto: #edf1f3;
    --texto-suave: #9db0b8;
    --borde: #26404c;
    --exito: #5cc08f;
    --exito-suave: #133326;
    --aviso: #d4b77a;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--fondo); color: var(--texto);
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-size: 14px;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body, .tarjeta, #menu, .opcion, .barra { transition: background-color .3s ease, color .3s ease, border-color .3s ease; }
  a { color: var(--primario); }
  button { font-family: inherit; cursor: pointer; }
  .ico { width: 18px; height: 18px; flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* Franja del ambiente de pruebas: siempre visible para no confundirlo con producción. */
  .aviso-ambiente {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 26px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--dorado); color: #06263A; font-size: 12px; font-weight: 600; letter-spacing: .3px;
  }
  body.con-aviso #app { padding-top: 26px; }
  .aviso-ambiente { padding: 0 12px; }
  #aviso-texto { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aviso-ambiente.viendo-como { background: #1e7d4f; color: #fff; }
  .aviso-boton {
    border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px;
    padding: 0 10px; font-size: 11px; line-height: 18px; font-weight: 600; margin-left: 8px;
    white-space: nowrap; flex-shrink: 0;
  }
  .aviso-boton:hover { background: rgba(255,255,255,.18); }

  /* ─────────── Estructura: menú lateral + contenido ─────────── */
  #app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  #menu {
    width: 268px; flex-shrink: 0; height: 100%;
    background: var(--menu-fondo); border-right: 1px solid var(--menu-borde);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto; overflow-x: hidden; transition: width .25s ease;
    scrollbar-width: thin; scrollbar-color: rgba(180,161,105,.5) transparent;
  }
  #menu.colapsado { width: 84px; }
  .menu-marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 14px; margin-bottom: 6px; border-bottom: 1px solid var(--menu-borde); }
  .menu-logo { width: 34px; height: 34px; border-radius: 999px; background: #fff; padding: 4px; object-fit: contain; flex-shrink: 0; }
  .menu-titulo { display: flex; flex-direction: column; min-width: 0; }
  .menu-titulo strong { color: var(--menu-texto-fuerte); font-size: 15.5px; font-weight: 600; }
  .menu-titulo span { color: var(--menu-texto); font-size: 11.5px; white-space: nowrap; }
  .menu-opciones { display: flex; flex-direction: column; gap: 2px; }
  .menu-seccion {
    color: var(--dorado); font-size: 10.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    padding: 14px 13px 6px; white-space: nowrap;
  }
  .opcion {
    display: flex; align-items: center; gap: 11px; width: 100%; border: 0; text-align: left;
    padding: 10px 13px; border-radius: var(--radio); background: transparent;
    color: var(--menu-texto); font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .opcion:hover { background: var(--menu-hover); color: var(--menu-texto-fuerte); }
  .opcion.activa { background: var(--dorado); color: #06263A; font-weight: 600; }
  .opcion .menu-texto { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .opcion .pronto {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--menu-texto);
  }
  .opcion.activa .pronto { background: rgba(6,38,58,.15); color: #06263A; }
  .menu-relleno { flex: 1; }
  .menu-colapsar {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
    color: var(--menu-texto); padding: 9px 13px; border-radius: var(--radio); font-size: 13px; white-space: nowrap;
  }
  .menu-colapsar:hover { background: var(--menu-hover); }
  .menu-colapsar .ico { transition: transform .25s ease; }
  #menu.colapsado .menu-titulo, #menu.colapsado .menu-texto, #menu.colapsado .pronto,
  #menu.colapsado .menu-seccion { display: none; }
  #menu.colapsado .opcion, #menu.colapsado .menu-colapsar, #menu.colapsado .menu-marca { justify-content: center; }
  #menu.colapsado .menu-colapsar .ico { transform: rotate(180deg); }

  #principal { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .barra {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    padding: 10px 28px; background: var(--superficie); border-bottom: 1px solid var(--borde); box-shadow: var(--sombra);
  }
  .barra-izq, .barra-der { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .barra-logo { height: 34px; width: auto; }
  .logo-oscuro { display: none; }
  :root[data-theme="dark"] .logo-claro { display: none; }
  :root[data-theme="dark"] .logo-oscuro { display: block; }
  .barra-fecha { font-size: 12.5px; font-weight: 500; color: var(--texto-suave); white-space: nowrap; }
  .selector-tema { display: flex; gap: 4px; background: var(--fondo); border: 1px solid var(--borde); border-radius: 999px; padding: 3px; }
  .btn-tema {
    width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--texto-suave);
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-tema .ico { width: 15px; height: 15px; }
  .btn-tema.activo { background: var(--primario); color: #fff; }
  .barra-usuario { display: flex; align-items: center; gap: 10px; padding-left: 14px; border-left: 1px solid var(--borde); min-width: 0; }
  .avatar {
    width: 34px; height: 34px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover); font-weight: 700; font-size: 13px;
  }
  .usuario-datos { display: flex; flex-direction: column; min-width: 0; }
  .usuario-datos strong { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .usuario-datos span { font-size: 11px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .btn-icono {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--borde); background: var(--superficie);
    color: var(--texto); display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-menu-movil { display: none; }

  /* «Ver como» (solo administradores en pruebas) */
  .ver-como {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px 4px 12px; border-radius: 999px;
    border: 1px dashed var(--dorado); background: var(--dorado-suave); color: var(--dorado-hover);
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .ver-como .ico { width: 16px; height: 16px; }
  .ver-como select {
    max-width: 230px; border: 0; border-radius: 999px; padding: 5px 8px; font-family: inherit; font-size: 12px;
    background: var(--superficie); color: var(--texto); cursor: pointer;
  }
  .ver-como select:disabled { opacity: .6; cursor: wait; }

  .vista { flex: 1; overflow-y: auto; padding: 26px 28px 40px; outline: none; }
  .vista-ancho { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ─────────── Componentes ─────────── */
  .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 22px; }
  .titulo-vista { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 21px; font-weight: 600; }
  .titulo-vista .ico { width: 22px; height: 22px; color: var(--dorado); }
  .subtitulo { margin: 4px 0 0; color: var(--texto-suave); }
  h2.seccion { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; background: var(--primario-suave); color: var(--primario);
  }
  .chip.dorado { background: var(--dorado-suave); color: var(--dorado-hover); }
  .chip.exito { background: var(--exito-suave); color: var(--exito); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .boton {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 600; background: var(--primario); color: #fff;
  }
  .boton:hover { background: var(--primario-hover); }
  .boton:disabled { opacity: .55; cursor: not-allowed; }
  .boton.secundario { background: transparent; color: var(--primario); border: 1px solid var(--borde); }

  /* Inicio */
  .bienvenida {
    display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    background: linear-gradient(120deg, #06263A 0%, #0c3550 60%, #1d4560 100%); color: #fff; border: 0;
  }
  .bienvenida h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .bienvenida p { margin: 6px 0 0; color: #c9d6dd; max-width: 560px; }
  .bienvenida .chip { background: rgba(180,161,105,.22); color: #e5d7ad; }
  .pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .paso { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .paso-num {
    width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover);
  }
  .paso strong { font-size: 14px; }
  .paso p { margin: 0; color: var(--texto-suave); font-size: 12.5px; line-height: 1.5; }
  .accesos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .acceso {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 16px; color: var(--texto); box-shadow: var(--sombra);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .acceso:hover { transform: translateY(-2px); box-shadow: var(--sombra-grande); border-color: var(--dorado); }
  .acceso-icono {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--primario-suave); color: var(--primario);
  }
  .acceso-texto { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .acceso strong { font-size: 13.5px; }
  .acceso-desc { font-size: 12px; color: var(--texto-suave); margin-top: 3px; line-height: 1.45; }
  .acceso .chip { margin-top: 8px; }

  /* Lo que podrá hacer cada perfil en una pantalla en construcción */
  .acciones { border-top: 1px solid var(--borde); padding-top: 18px; max-width: 560px; margin: 0 auto; }
  .acciones h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .acciones ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .acciones li { display: flex; gap: 10px; align-items: flex-start; color: var(--texto-suave); line-height: 1.5; }
  .acciones li .ico { width: 16px; height: 16px; margin-top: 3px; color: var(--exito); }

  /* Estados vacíos y pantallas en construcción */
  .vacio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 46px 20px; }
  .vacio-icono {
    width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover);
  }
  .vacio-icono .ico { width: 30px; height: 30px; }
  .vacio h2 { margin: 6px 0 0; font-size: 17px; font-weight: 600; }
  .vacio p { margin: 0; color: var(--texto-suave); max-width: 480px; line-height: 1.55; }

  /* Catálogos */
  .codigo-ejemplo { display: flex; flex-direction: column; gap: 10px; }
  .codigo-ejemplo-titulo { font-size: 12px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .6px; }
  .codigo-ejemplo p { margin: 0; color: var(--texto-suave); font-size: 12.5px; }
  .codigo-partes { display: flex; align-items: flex-start; gap: 6px; }
  .codigo-parte { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .codigo-parte strong {
    font-size: 20px; font-weight: 700; padding: 6px 12px; border-radius: 10px; letter-spacing: 1px;
    background: var(--primario-suave); color: var(--primario);
  }
  .codigo-parte small { font-size: 11px; color: var(--texto-suave); }
  .codigo-guion { font-size: 20px; font-weight: 700; color: var(--texto-suave); padding-top: 6px; }

  .barra-filtros { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .buscador {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto-suave);
  }
  .buscador input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--texto); padding: 10px 0;
    font-family: inherit; font-size: 13.5px; outline: none;
  }
  .buscador:focus-within { border-color: var(--dorado); }
  .interruptor { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--texto-suave); cursor: pointer; }
  .interruptor input { accent-color: var(--primario); width: 16px; height: 16px; }

  .catalogo-lista { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .catalogo-depto { border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .catalogo-titulo {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none;
    background: var(--superficie);
  }
  .catalogo-titulo::-webkit-details-marker { display: none; }
  .catalogo-titulo:hover { background: var(--fondo); }
  .catalogo-depto[open] .catalogo-titulo { border-bottom: 1px solid var(--borde); background: var(--fondo); }
  .catalogo-clave {
    min-width: 46px; text-align: center; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 12.5px;
    background: var(--primario); color: #fff;
  }
  .catalogo-depto-nombre { flex: 1; font-weight: 600; font-size: 13.5px; }
  .catalogo-conteo { font-size: 12px; color: var(--texto-suave); white-space: nowrap; }
  .catalogo-areas { display: flex; flex-direction: column; }
  .catalogo-fila { display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--borde); align-items: flex-start; }
  .catalogo-fila:first-child { border-top: 0; }
  .catalogo-fila.inactiva { opacity: .6; }
  .catalogo-cuerpo {
    min-width: 62px; font-weight: 700; font-size: 13px; color: var(--dorado-hover); letter-spacing: .5px; padding-top: 1px;
  }
  .catalogo-datos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .catalogo-nombre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 500; }
  .catalogo-subareas { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip.subarea { background: var(--fondo); color: var(--texto-suave); border: 1px solid var(--borde); font-weight: 500; }
  .catalogo-nota { font-size: 11.5px; color: var(--texto-suave); line-height: 1.45; }
  .girando { animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* Encabezado de pantalla con botón a la derecha */
  .encabezado-vista { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .aviso-consulta {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
    background: var(--primario-suave); color: var(--primario); font-size: 13px; font-weight: 500;
  }
  .selector {
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 9px 12px; font-family: inherit; font-size: 13px;
  }
  .nota { margin: 4px 0 0; font-size: 12px; color: var(--texto-suave); }

  /* Usuarios */
  .usuarios-lista { display: flex; flex-direction: column; margin-top: 12px; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .usuario-fila { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-top: 1px solid var(--borde); }
  .usuario-fila:first-child { border-top: 0; }
  .usuario-fila.inactiva { opacity: .6; }
  .usuario-datos-fila { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .usuario-nombre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 13.5px; }
  .usuario-correo { font-size: 12px; color: var(--texto-suave); word-break: break-all; }
  .usuario-deptos { font-size: 12px; color: var(--texto-suave); }

  /* Panel lateral (alta y edición) */
  .panel-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(6,38,58,.45); display: flex; justify-content: flex-end; }
  .panel {
    width: min(520px, 100%); height: 100%; background: var(--superficie); box-shadow: var(--sombra-grande);
    display: flex; flex-direction: column; animation: entrar .2s ease;
  }
  @keyframes entrar { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-encabezado { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
  .panel-encabezado h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .panel-cuerpo { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
  .panel-pie { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--borde); }
  .campo { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .campo > span, .campo legend { font-size: 12.5px; font-weight: 600; padding: 0; margin-bottom: 2px; }
  .campo input[type="email"], .campo input[type="text"] {
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
  }
  .campo input:focus { outline: none; border-color: var(--dorado); }
  .campo input[readonly] { opacity: .7; }
  .campo small { font-size: 11.5px; color: var(--texto-suave); line-height: 1.45; }
  .contador { font-weight: 500; color: var(--texto-suave); }
  .opciones-perfil { display: flex; flex-direction: column; gap: 8px; }
  .opcion-perfil {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--borde);
    border-radius: 10px; cursor: pointer;
  }
  .opcion-perfil:has(input:checked) { border-color: var(--dorado); background: var(--dorado-suave); }
  .opcion-perfil input { margin-top: 3px; accent-color: var(--primario); width: 16px; height: 16px; flex-shrink: 0; }
  .opcion-perfil span { display: flex; flex-direction: column; gap: 2px; }
  .opcion-perfil strong { font-size: 13px; }
  .nota-propia { color: var(--aviso) !important; font-weight: 500; }
  .buscador-chico input { padding: 8px 0; font-size: 12.5px; }
  .lista-deptos { max-height: 260px; overflow-y: auto; border: 1px solid var(--borde); border-radius: 10px; }
