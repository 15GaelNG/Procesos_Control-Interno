<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Colores de SIVET y Control Interno (azul marino y dorado de Ciudad Maderas). El menú lateral es
     azul marino en los dos temas; lo demás cambia con claro / oscuro. */
  :root {
    --primario: #06263A;
    --primario-hover: #0c3550;
    --primario-suave: #DDEBF7;
    --dorado: #B4A169;
    --dorado-hover: #9c8a58;
    --dorado-suave: #EBE5D1;

    --sobre-primario: #ffffff;
    --sombra-boton: rgba(6,38,58,.55);
    --halo: rgba(180,161,105,.24);

    --fondo: #F3F5F8;
    --superficie: #ffffff;
    --texto: #16242c;
    --texto-suave: #5c6b72;
    --borde: #E4E8ED;
    --exito: #1e7d4f;
    --exito-suave: #dcefe5;
    --aviso: #8a6d3a;
    --peligro: #a1362b;
    --peligro-suave: #f8e3e1;

    --menu-fondo: #06263A;
    --menu-texto: #b7c8d2;
    --menu-texto-fuerte: #ffffff;
    --menu-hover: rgba(255,255,255,.08);
    --menu-borde: rgba(255,255,255,.14);

    --radio: 20px;
    --sombra: 0 1px 2px rgba(6,38,58,.04), 0 10px 26px -18px rgba(6,38,58,.22);
    --sombra-grande: 0 28px 56px -24px rgba(6,38,58,.45);

    /* La firma de la IA */
    --ia-azul: #4C8DF6;
    --ia-violeta: #8B5CF0;
    --ia-rosa: #E6689F;
    --ia-dorado: #E0B458;
    --ia-fondo: #FAF8FF;
    --aurora: linear-gradient(100deg, var(--ia-azul) 0%, var(--ia-violeta) 36%, var(--ia-rosa) 68%, var(--ia-dorado) 100%);
    --aurora-boton: linear-gradient(100deg, #2f6fe0 0%, #7a4fe0 35%, #c2407f 65%, #7a4fe0 85%, #2f6fe0 100%);
    --luz-1: rgba(76,141,246,.13);
    --luz-2: rgba(224,180,88,.12);
    --luz-3: rgba(139,92,240,.09);

    --suave: cubic-bezier(.22,1,.36,1);
    --rebote: cubic-bezier(.3,1.5,.5,1);
  }

  :root[data-theme="dark"] {
    --primario: #86C1EC;
    --primario-hover: #A3D1F2;
    --primario-suave: #15303F;
    --sobre-primario: #06263A;
    --sombra-boton: rgba(0,0,0,.7);
    --halo: rgba(196,178,128,.2);
    --dorado: #c4b280;
    --dorado-hover: #d4c393;
    --dorado-suave: #2a2718;

    --fondo: #091219;
    --superficie: #111E28;
    --texto: #eef2f4;
    --texto-suave: #9db0b8;
    --borde: rgba(255,255,255,.09);
    --exito: #5cc08f;
    --exito-suave: #133326;
    --aviso: #d4b77a;
    --peligro: #e58a7f;
    --peligro-suave: #3a1d1a;
    --sombra: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -20px rgba(0,0,0,.8);
    --sombra-grande: 0 28px 56px -24px rgba(0,0,0,.85);
    --ia-violeta: #A98BF7;
    --ia-fondo: #181A2E;
    --luz-1: rgba(76,141,246,.15);
    --luz-2: rgba(224,180,88,.06);
    --luz-3: rgba(139,92,240,.14);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--fondo); color: var(--texto);
    font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body, .tarjeta, #menu, .opcion, .barra { transition: background-color .3s ease, color .3s ease, border-color .3s ease; }
  a { color: var(--primario); }
  button { font-family: inherit; cursor: pointer; }
  .ico { width: 18px; height: 18px; flex-shrink: 0; }
  [hidden] { display: none !important; }

  /* Franja del ambiente de pruebas: siempre visible para no confundirlo con producción. */
  .aviso-ambiente {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 26px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--dorado); color: #06263A; font-size: 12px; font-weight: 600; letter-spacing: .3px;
  }
  body.con-aviso #app { padding-top: 26px; }
  .aviso-ambiente { padding: 0 12px; }
  #aviso-texto { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aviso-ambiente.viendo-como { background: #1e7d4f; color: #fff; }
  .aviso-boton {
    border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px;
    padding: 0 10px; font-size: 11px; line-height: 18px; font-weight: 600; margin-left: 8px;
    white-space: nowrap; flex-shrink: 0;
  }
  .aviso-boton:hover { background: rgba(255,255,255,.18); }

  /* ─────────── Estructura: menú lateral + contenido ─────────── */
  #app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  #menu {
    width: 268px; flex-shrink: 0; height: 100%;
    background: var(--menu-fondo); border-right: 1px solid var(--menu-borde);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto; overflow-x: hidden; transition: width .25s ease;
    scrollbar-width: thin; scrollbar-color: rgba(180,161,105,.5) transparent;
  }
  #menu.colapsado { width: 84px; }
  .menu-marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 14px; margin-bottom: 6px; border-bottom: 1px solid var(--menu-borde); }
  .menu-logo { width: 34px; height: 34px; border-radius: 999px; background: #fff; padding: 4px; object-fit: contain; flex-shrink: 0; }
  .menu-titulo { display: flex; flex-direction: column; min-width: 0; }
  .menu-titulo strong { color: var(--menu-texto-fuerte); font-size: 15.5px; font-weight: 600; }
  .menu-titulo span { color: var(--menu-texto); font-size: 11.5px; white-space: nowrap; }
  .menu-opciones { display: flex; flex-direction: column; gap: 2px; }
  .menu-seccion {
    color: var(--dorado); font-size: 10.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    padding: 14px 13px 6px; white-space: nowrap;
  }
  .opcion {
    display: flex; align-items: center; gap: 11px; width: 100%; border: 0; text-align: left;
    padding: 10px 13px; border-radius: var(--radio); background: transparent;
    color: var(--menu-texto); font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden;
  }
  .opcion:hover { background: var(--menu-hover); color: var(--menu-texto-fuerte); }
  .opcion.activa { background: var(--dorado); color: #06263A; font-weight: 600; }
  .opcion .menu-texto { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .opcion .pronto {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--menu-texto);
  }
  .opcion.activa .pronto { background: rgba(6,38,58,.15); color: #06263A; }
  .menu-relleno { flex: 1; }
  .menu-colapsar {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
    color: var(--menu-texto); padding: 9px 13px; border-radius: var(--radio); font-size: 13px; white-space: nowrap;
  }
  .menu-colapsar:hover { background: var(--menu-hover); }
  .menu-colapsar .ico { transition: transform .25s ease; }
  #menu.colapsado .menu-titulo, #menu.colapsado .menu-texto, #menu.colapsado .pronto,
  #menu.colapsado .menu-seccion { display: none; }
  #menu.colapsado .opcion, #menu.colapsado .menu-colapsar, #menu.colapsado .menu-marca { justify-content: center; }
  #menu.colapsado .menu-colapsar .ico { transform: rotate(180deg); }

  #principal { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .barra {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    padding: 10px 28px; background: var(--superficie); border-bottom: 1px solid var(--borde); box-shadow: var(--sombra);
  }
  .barra-izq, .barra-der { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .barra-logo { height: 34px; width: auto; }
  .logo-oscuro { display: none; }
  :root[data-theme="dark"] .logo-claro { display: none; }
  :root[data-theme="dark"] .logo-oscuro { display: block; }
  .barra-fecha { font-size: 12.5px; font-weight: 500; color: var(--texto-suave); white-space: nowrap; }
  .selector-tema { display: flex; gap: 4px; background: var(--fondo); border: 1px solid var(--borde); border-radius: 999px; padding: 3px; }
  .btn-tema {
    width: 30px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--texto-suave);
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-tema .ico { width: 15px; height: 15px; }
  .btn-tema.activo { background: var(--primario); color: #fff; }
  .barra-usuario { display: flex; align-items: center; gap: 10px; padding-left: 14px; border-left: 1px solid var(--borde); min-width: 0; }
  .avatar {
    width: 34px; height: 34px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover); font-weight: 700; font-size: 13px;
  }
  .usuario-datos { display: flex; flex-direction: column; min-width: 0; }
  .usuario-datos strong { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .usuario-datos span { font-size: 11px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .btn-icono {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--borde); background: var(--superficie);
    color: var(--texto); display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-menu-movil { display: none; }

  /* «Ver como» (solo administradores en pruebas) */
  .ver-como {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px 4px 12px; border-radius: 999px;
    border: 1px dashed var(--dorado); background: var(--dorado-suave); color: var(--dorado-hover);
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .ver-como .ico { width: 16px; height: 16px; }
  .ver-como select {
    max-width: 230px; border: 0; border-radius: 999px; padding: 5px 8px; font-family: inherit; font-size: 12px;
    background: var(--superficie); color: var(--texto); cursor: pointer;
  }
  .ver-como select:disabled { opacity: .6; cursor: wait; }

  .vista { flex: 1; overflow-y: auto; padding: 26px 28px 40px; outline: none; }
  .vista-ancho { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ─────────── Componentes ─────────── */
  .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 22px; }
  .titulo-vista { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 21px; font-weight: 600; }
  .titulo-vista .ico { width: 22px; height: 22px; color: var(--dorado); }
  .subtitulo { margin: 4px 0 0; color: var(--texto-suave); }
  h2.seccion { margin: 6px 0 0; font-size: 15px; font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; background: var(--primario-suave); color: var(--primario);
  }
  .chip.dorado { background: var(--dorado-suave); color: var(--dorado-hover); }
  .chip.exito { background: var(--exito-suave); color: var(--exito); }
  .chip.neutro { background: var(--fondo); color: var(--texto-suave); border: 1px solid var(--borde); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .boton {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 600; background: var(--primario); color: #fff;
  }
  .boton:hover { background: var(--primario-hover); }
  .boton:disabled { opacity: .55; cursor: not-allowed; }
  .boton.secundario { background: transparent; color: var(--primario); border: 1px solid var(--borde); }
  .boton.secundario.peligro { color: var(--peligro); border-color: var(--peligro); }
  .boton.secundario.peligro:hover { background: var(--peligro-suave); }

  /* Inicio */
  .pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .paso { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .paso-num {
    width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover);
  }
  .paso strong { font-size: 14px; }
  .paso p { margin: 0; color: var(--texto-suave); font-size: 12.5px; line-height: 1.5; }
  .accesos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .acceso {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 16px; color: var(--texto); box-shadow: var(--sombra);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .acceso:hover { transform: translateY(-2px); box-shadow: var(--sombra-grande); border-color: var(--dorado); }
  .acceso-icono {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--primario-suave); color: var(--primario);
  }
  .acceso-texto { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .acceso strong { font-size: 13.5px; }
  .acceso-desc { font-size: 12px; color: var(--texto-suave); margin-top: 3px; line-height: 1.45; }
  .acceso .chip { margin-top: 8px; }

  /* Lo que podrá hacer cada perfil en una pantalla en construcción */
  .acciones { border-top: 1px solid var(--borde); padding-top: 18px; max-width: 560px; margin: 0 auto; }
  .acciones h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .acciones ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .acciones li { display: flex; gap: 10px; align-items: flex-start; color: var(--texto-suave); line-height: 1.5; }
  .acciones li .ico { width: 16px; height: 16px; margin-top: 3px; color: var(--exito); }

  /* Estados vacíos y pantallas en construcción */
  .vacio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 46px 20px; }
  .vacio-icono {
    width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: var(--dorado-suave); color: var(--dorado-hover);
  }
  .vacio-icono .ico { width: 30px; height: 30px; }
  .vacio h2 { margin: 6px 0 0; font-size: 17px; font-weight: 600; }
  .vacio p { margin: 0; color: var(--texto-suave); max-width: 480px; line-height: 1.55; }

  /* Catálogos */
  .codigo-ejemplo { display: flex; flex-direction: column; gap: 10px; }
  .codigo-ejemplo-titulo { font-size: 12px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .6px; }
  .codigo-ejemplo p { margin: 0; color: var(--texto-suave); font-size: 12.5px; }
  .codigo-partes { display: flex; align-items: flex-start; gap: 6px; }
  .codigo-parte { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .codigo-parte strong {
    font-size: 20px; font-weight: 700; padding: 6px 12px; border-radius: 10px; letter-spacing: 1px;
    background: var(--primario-suave); color: var(--primario);
  }
  .codigo-parte small { font-size: 11px; color: var(--texto-suave); }
  .codigo-guion { font-size: 20px; font-weight: 700; color: var(--texto-suave); padding-top: 6px; }

  .barra-filtros { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .buscador {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto-suave);
  }
  .buscador input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--texto); padding: 10px 0;
    font-family: inherit; font-size: 13.5px; outline: none;
  }
  .buscador:focus-within { border-color: var(--dorado); }
  .interruptor { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--texto-suave); cursor: pointer; }
  .interruptor input { accent-color: var(--primario); width: 16px; height: 16px; }

  .catalogo-lista { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .catalogo-depto { border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .catalogo-titulo {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none;
    background: var(--superficie);
  }
  .catalogo-titulo::-webkit-details-marker { display: none; }
  .catalogo-titulo:hover { background: var(--fondo); }
  .catalogo-depto[open] .catalogo-titulo { border-bottom: 1px solid var(--borde); background: var(--fondo); }
  .catalogo-clave {
    min-width: 46px; text-align: center; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 12.5px;
    background: var(--primario); color: #fff;
  }
  .catalogo-depto-nombre { flex: 1; font-weight: 600; font-size: 13.5px; }
  .catalogo-conteo { font-size: 12px; color: var(--texto-suave); white-space: nowrap; }
  .catalogo-areas { display: flex; flex-direction: column; }
  .catalogo-fila { display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--borde); align-items: flex-start; }
  .catalogo-fila:first-child { border-top: 0; }
  .catalogo-fila.inactiva { opacity: .6; }
  .catalogo-cuerpo {
    min-width: 62px; font-weight: 700; font-size: 13px; color: var(--dorado-hover); letter-spacing: .5px; padding-top: 1px;
  }
  .catalogo-datos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .catalogo-nombre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 500; }
  .catalogo-subareas { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip.subarea { background: var(--fondo); color: var(--texto-suave); border: 1px solid var(--borde); font-weight: 500; }
  .catalogo-nota { font-size: 11.5px; color: var(--texto-suave); line-height: 1.45; }
  .girando { animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* Encabezado de pantalla con botón a la derecha */
  .encabezado-vista { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .aviso-consulta {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
    background: var(--primario-suave); color: var(--primario); font-size: 13px; font-weight: 500;
  }
  .selector {
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 9px 12px; font-family: inherit; font-size: 13px;
  }
  .selector.selector-chico { padding: 7px 10px; font-size: 12.5px; max-width: 200px; }
  .aviso-consulta.dorado { background: var(--dorado-suave); color: var(--aviso); flex-wrap: wrap; }
  .aviso-consulta .enlace { margin-left: auto; color: inherit; text-decoration: underline; }
  .nota { margin: 4px 0 0; font-size: 12px; color: var(--texto-suave); }

  /* Usuarios */
  .usuarios-lista { display: flex; flex-direction: column; margin-top: 12px; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .usuario-fila { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-top: 1px solid var(--borde); }
  .usuario-fila:first-child { border-top: 0; }
  .usuario-fila.inactiva { opacity: .6; }
  .usuario-datos-fila { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .usuario-nombre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 13.5px; }
  .usuario-correo { font-size: 12px; color: var(--texto-suave); word-break: break-all; }
  .usuario-deptos { font-size: 12px; color: var(--texto-suave); }

  /* Panel lateral (alta y edición) */
  .panel-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(6,38,58,.45); display: flex; justify-content: flex-end; }
  .panel {
    width: min(520px, 100%); height: 100%; background: var(--superficie); box-shadow: var(--sombra-grande);
    display: flex; flex-direction: column; animation: entrar .2s ease;
  }
  @keyframes entrar { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-encabezado { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
  .panel-encabezado h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .panel-cuerpo { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
  .panel-pie { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--borde); }
  .campo { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .campo > span, .campo legend { font-size: 12.5px; font-weight: 600; padding: 0; margin-bottom: 2px; }
  .campo input[type="email"], .campo input[type="text"], .campo input[type="date"] {
    border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
  }
  .campo input:focus { outline: none; border-color: var(--dorado); }
  .campo input[readonly] { opacity: .7; }
  .campo small { font-size: 11.5px; color: var(--texto-suave); line-height: 1.45; }
  .contador { font-weight: 500; color: var(--texto-suave); }
  .opciones-perfil { display: flex; flex-direction: column; gap: 8px; }
  .opcion-perfil {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--borde);
    border-radius: 10px; cursor: pointer;
  }
  .opcion-perfil:has(input:checked) { border-color: var(--dorado); background: var(--dorado-suave); }
  .opcion-perfil input { margin-top: 3px; accent-color: var(--primario); width: 16px; height: 16px; flex-shrink: 0; }
  .opcion-perfil span { display: flex; flex-direction: column; gap: 2px; }
  .opcion-perfil strong { font-size: 13px; }
  .nota-propia { color: var(--aviso) !important; font-weight: 500; }
  .buscador-chico input { padding: 8px 0; font-size: 12.5px; }
  .lista-deptos { max-height: 260px; overflow-y: auto; border: 1px solid var(--borde); border-radius: 10px; }
  .depto-opcion { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--borde); }
  .depto-opcion:first-child { border-top: 0; }
  .depto-opcion.marcado { background: var(--primario-suave); }
  .depto-nombre { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; min-width: 0; }
  .depto-nombre input, .depto-principal input { accent-color: var(--primario); flex-shrink: 0; }
  .depto-nombre .catalogo-clave { min-width: 0; font-size: 11px; padding: 1px 6px; }
  .depto-principal { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--texto-suave); white-space: nowrap; cursor: pointer; }
  .errores {
    padding: 10px 12px; border-radius: 10px; background: var(--dorado-suave); color: var(--aviso);
    font-size: 12.5px; font-weight: 500; line-height: 1.5;
  }

  /* Bitácora */
  .bitacora-lista { display: flex; flex-direction: column; margin-top: 10px; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .bitacora-fila { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-top: 1px solid var(--borde); }
  .bitacora-fila:first-child { border-top: 0; }
  .bitacora-cabeza { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bitacora-usuario { font-size: 12.5px; font-weight: 600; word-break: break-all; }
  .bitacora-fecha { margin-left: auto; font-size: 12px; color: var(--texto-suave); white-space: nowrap; }
  .bitacora-solicitud { font-size: 12px; font-weight: 600; color: var(--dorado-hover); }
  .bitacora-detalle { font-size: 12.5px; color: var(--texto-suave); line-height: 1.5; word-break: break-word; }

  /* Avisos flotantes */
  .avisos { position: fixed; bottom: 18px; right: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  .aviso-flotante {
    padding: 11px 16px; border-radius: 10px; box-shadow: var(--sombra-grande); font-size: 13px; font-weight: 500;
    background: var(--primario); color: #fff; transition: opacity .4s ease, transform .4s ease;
  }
  .aviso-flotante.exito { background: #1e7d4f; }
  .aviso-flotante.error { background: var(--aviso); }
  .aviso-flotante.saliendo { opacity: 0; transform: translateY(6px); }

  /* ─────────── Captura (fase 2) ─────────── */
  .pasos-captura { display: flex; gap: 8px; flex-wrap: wrap; }
  .paso-captura {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 999px;
    background: var(--superficie); border: 1px solid var(--borde); font-size: 12.5px; color: var(--texto-suave); font-weight: 500;
    font-family: inherit;
  }
  button.paso-captura:hover { border-color: var(--dorado); color: var(--texto); }
  .paso-captura > span {
    width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: var(--fondo); font-size: 11.5px; font-weight: 700;
  }
  .paso-captura.actual { border-color: var(--dorado); color: var(--texto); font-weight: 600; }
  .paso-captura.actual > span { background: var(--dorado); color: #06263A; }
  .paso-captura.hecho > span { background: var(--exito-suave); color: var(--exito); }

  .formulario-nueva { display: flex; flex-direction: column; gap: 20px; }
  .formulario-nueva [data-campo="bloque-nuevo"], .bloque-actualizacion { display: flex; flex-direction: column; gap: 20px; }
  .opciones-tarjeta { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .opcion-tarjeta {
    display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--borde);
    border-radius: 10px; cursor: pointer; background: var(--superficie);
  }
  .opcion-tarjeta:has(input:checked) { border-color: var(--dorado); background: var(--dorado-suave); }
  .opcion-tarjeta.no-disponible { cursor: not-allowed; opacity: .55; }
  .opcion-tarjeta input { margin-top: 3px; accent-color: var(--primario); }
  .opcion-tarjeta span { display: flex; flex-direction: column; gap: 2px; }
  .opcion-tarjeta strong { font-size: 13px; }
  .opcion-tarjeta small { font-size: 11.5px; color: var(--texto-suave); }
  .campos-fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .campo .selector { width: 100%; }
  .opcional { font-style: normal; font-weight: 400; color: var(--texto-suave); }
  .datos-automaticos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px;
    padding: 14px; border-radius: 10px; background: var(--fondo);
  }
  .datos-automaticos div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .datos-automaticos span { font-size: 11px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .4px; }
  .datos-automaticos strong { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .acciones-formulario { display: flex; justify-content: flex-end; }
  .coincidencias {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--dorado); background: var(--dorado-suave);
  }
  .coincidencias-titulo { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; font-weight: 500; color: var(--aviso); }
  .coincidencia { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .coincidencia-nombre { font-weight: 600; }

  .solicitudes-lista { display: flex; flex-direction: column; margin-top: 12px; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .solicitud-fila { display: flex; align-items: center; gap: 14px; padding: 14px; border-top: 1px solid var(--borde); }
  .solicitud-fila:first-child { border-top: 0; }
  .solicitud-fila.inactiva { opacity: .6; }
  .solicitud-datos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .solicitud-cabeza { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .solicitud-nombre { font-weight: 600; font-size: 14px; }
  .solicitud-botones { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .folio { font-size: 12px; font-weight: 700; color: var(--dorado-hover); letter-spacing: .4px; }
  .chip.estado-borrador { background: var(--fondo); color: var(--texto-suave); border: 1px solid var(--borde); }
  .chip.estado-confirmado, .chip.estado-en_revision { background: var(--primario-suave); color: var(--primario); }
  .chip.estado-devuelto { background: var(--dorado-suave); color: var(--aviso); }
  .chip.estado-en_autorizacion_ch, .chip.estado-autorizado { background: var(--exito-suave); color: var(--exito); }
  .chip.estado-cancelado, .chip.estado-no_procedente { background: var(--fondo); color: var(--texto-suave); text-decoration: line-through; }

  .enlace-volver {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent;
    color: var(--texto-suave); font-size: 13px; font-weight: 500; padding: 4px 0;
  }
  .enlace-volver:hover { color: var(--texto); }
  .editor { display: flex; flex-direction: column; gap: 18px; }
  .encabezado-solicitud { display: flex; flex-direction: column; gap: 14px; }
  .encabezado-solicitud-titulo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .encabezado-solicitud h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  .aviso-conflicto {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px;
    background: var(--dorado-suave); color: var(--aviso); font-weight: 600; font-size: 13px;
  }
  .desarrollo { display: flex; flex-direction: column; gap: 16px; }
  .desarrollo-encabezado { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .desarrollo-encabezado h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .separador { height: 1px; background: var(--borde); }
  .subtitulo-seccion { margin: 0; font-size: 14.5px; font-weight: 600; }
  kbd {
    font-family: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--borde); background: var(--fondo);
  }
  .campo textarea, .actividad textarea {
    width: 100%; resize: vertical; border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo);
    color: var(--texto); padding: 11px 13px; font-family: inherit; font-size: 13.5px; line-height: 1.55;
  }
  .campo textarea:focus, .actividad textarea:focus { outline: none; border-color: var(--dorado); }
  textarea[readonly] { background: transparent; resize: none; }
  .estado-guardado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--texto-suave); }
  .estado-guardado .ico { width: 15px; height: 15px; }
  .estado-guardado.guardado { color: var(--exito); }
  .estado-guardado.error { color: var(--aviso); }

  .actividades { display: flex; flex-direction: column; gap: 12px; }
  .actividad {
    display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--borde);
    border-radius: 12px; background: var(--superficie); transition: border-color .15s ease, box-shadow .15s ease;
  }
  .actividad:focus-within { border-color: var(--dorado); box-shadow: 0 0 0 3px rgba(180,161,105,.15); }
  .actividad.soltando { border-style: dashed; border-color: var(--dorado); background: var(--dorado-suave); }
  .actividad-encabezado { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .actividad-encabezado h4 { margin: 0; font-size: 14px; font-weight: 600; }
  .actividad-botones { display: flex; gap: 4px; }
  .btn-icono.chico { width: 30px; height: 30px; border-radius: 8px; }
  .btn-icono.chico .ico { width: 15px; height: 15px; }
  .btn-icono:disabled { opacity: .35; cursor: default; }
  .responsable {
    display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--borde); border-radius: 10px;
    color: var(--texto-suave); background: var(--fondo);
  }
  .responsable input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--texto); padding: 9px 0; font-family: inherit; font-size: 13px; outline: none; }
  .responsable:focus-within { border-color: var(--dorado); }
  .imagenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .imagenes:empty { display: none; }
  .imagen { margin: 0; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--borde); border-radius: 10px; padding: 6px; position: relative; }
  .imagen-vista { border: 0; padding: 0; background: var(--fondo); border-radius: 7px; height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in; }
  .imagen-vista img { max-width: 100%; max-height: 120px; object-fit: contain; }
  .imagen.cargando .imagen-vista, .imagen.subiendo .imagen-vista { animation: latido 1.2s ease-in-out infinite; }
  .imagen.subiendo::after {
    content: 'Subiendo…'; position: absolute; top: 12px; left: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--primario); color: #fff; font-size: 11px; font-weight: 600;
  }
  @keyframes latido { 50% { opacity: .55; } }
  .imagen figcaption input {
    width: 100%; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--texto);
    padding: 5px 6px; font-family: inherit; font-size: 12px;
  }
  .imagen figcaption input:focus { outline: none; border-color: var(--dorado); background: var(--fondo); }
  .imagen-botones { display: flex; justify-content: flex-end; gap: 4px; }
  .adjuntar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .boton-adjuntar {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--primario);
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
  }
  .boton-adjuntar:hover { background: var(--primario-suave); }
  .boton-agregar {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px;
    border: 1px dashed var(--borde); border-radius: 12px; background: transparent; color: var(--texto); font-size: 13.5px; font-weight: 600;
  }
  .boton-agregar:hover { border-color: var(--dorado); background: var(--dorado-suave); }
  .siguiente-paso { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .siguiente-paso .nota { max-width: 560px; }

  .visor {
    position: fixed; inset: 0; z-index: 90; background: rgba(6,18,26,.88); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 50px 20px 20px;
  }
  .visor img { max-width: 100%; max-height: calc(100% - 50px); object-fit: contain; border-radius: 6px; background: #fff; }
  .visor-pie { margin: 0; color: #e8eef1; font-size: 13px; text-align: center; }
  .visor-cerrar { position: absolute; top: 14px; right: 14px; }

  /* ─────────── Análisis con IA (paso 4) ─────────── */
  .analisis { display: flex; flex-direction: column; gap: 18px; }
  .analisis.ocupado { opacity: .7; pointer-events: none; }
  .analisis-encabezado { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .analisis-encabezado h1 { margin: 2px 0 6px; font-size: 20px; font-weight: 600; }
  .analisis-encabezado > div { flex: 1; min-width: 260px; }
  .analizando { display: flex; align-items: center; gap: 14px; border-color: var(--dorado); }
  .girando-lento { animation: girar 2.4s linear infinite; }
  .avisos-ia { padding: 12px 14px; border-radius: 10px; background: var(--dorado-suave); color: var(--aviso); font-size: 12.5px; }
  .resultado-ia {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px;
    background: var(--exito-suave); color: var(--exito);
  }
  .resultado-ia > .ico { flex-shrink: 0; margin-top: 2px; }
  .resultado-ia .nota { color: inherit; opacity: .9; margin: 4px 0 0; }
  .resultado-ia.error { background: var(--peligro-suave); color: var(--peligro); }
  .seccion-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seccion-cabeza h2 { margin: 0; }
  .desarrollo-acciones { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .analisis-botones { display: flex; flex-direction: column; gap: 8px; align-items: stretch; flex-shrink: 0; }
  /* Sugerencia de la IA mientras se escribe (paso 3) */
  .sugerencia-ia { border: 1px dashed var(--dorado); background: var(--dorado-suave); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .sugerencia-ia-cabeza { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--aviso); flex-wrap: wrap; }
  .sugerencia-ia-cabeza .ico { width: 15px; height: 15px; }
  .sugerencia-ia-cabeza .nota { margin: 0 0 0 4px; }
  .sugerencia-ia-texto { margin: 0; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; color: var(--texto); }
  .revisando-ia { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
  .revisando-ia .ico { width: 14px; height: 14px; }
  .seccion-analisis { display: flex; flex-direction: column; gap: 12px; }
  .seccion-analisis h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seccion-analisis h2 .ico { color: var(--dorado); }
  .lista-preguntas { display: flex; flex-direction: column; gap: 10px; }
  .pregunta { border: 1px solid var(--dorado); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .pregunta.respondida { border-color: var(--borde); }
  .pregunta-cabeza { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pregunta-texto { margin: 0; font-weight: 600; font-size: 13.5px; }
  .pregunta-respuesta { display: flex; align-items: baseline; gap: 10px; color: var(--texto-suave); font-size: 13px; }
  .pregunta-formulario { display: flex; flex-direction: column; gap: 8px; }
  .pregunta-formulario textarea, .edicion textarea, .derivado textarea {
    width: 100%; resize: vertical; border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 10px 12px; font-family: inherit; font-size: 13px; line-height: 1.5;
  }
  .pregunta-formulario textarea:focus, .edicion textarea:focus, .derivado textarea:focus { outline: none; border-color: var(--dorado); }
  .pregunta-botones, .propuesta-botones { display: flex; gap: 8px; flex-wrap: wrap; }
  .enlace { border: 0; background: transparent; color: var(--primario); font-weight: 600; font-size: 12.5px; padding: 0; }
  .grupo-actividad { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
  .grupo-actividad + .grupo-actividad { border-top: 1px solid var(--borde); padding-top: 14px; }
  .grupo-actividad h3, .derivado h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .propuesta { border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--superficie); }
  .propuesta-cabeza { display: flex; gap: 8px; flex-wrap: wrap; }
  .comparacion { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .comparacion > div { border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
  .comparacion > div > span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
  .comparacion .antes { background: var(--fondo); color: var(--texto-suave); }
  .comparacion .despues { background: var(--exito-suave); }
  .comparacion .despues > span { color: var(--exito); }
  .lista-renglones { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
  .derivados { display: flex; flex-direction: column; gap: 18px; }
  .derivado { display: flex; flex-direction: column; gap: 8px; }
  .derivado .nota { margin: 0; }
  .acciones-formulario { gap: 12px; align-items: center; }
  .decididas summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
  .decididas[open] summary { margin-bottom: 10px; }
  .decidida { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; border-top: 1px solid var(--borde); }

  /* ─────────── Vista previa (paso 5) ─────────── */
  .vista-previa { display: flex; flex-direction: column; gap: 18px; }
  .aviso-confirmada {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px;
    background: var(--exito-suave); color: var(--exito);
  }
  .aviso-confirmada .nota { color: inherit; opacity: .85; margin: 4px 0 0; }
  .documento-previo { display: flex; flex-direction: column; gap: 20px; border-top: 4px solid var(--dorado); }
  .documento-encabezado h1 { margin: 2px 0 12px; font-size: 22px; font-weight: 700; }
  .documento-seccion { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .documento-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .documento-cabeza > :first-child { flex: 1; min-width: 0; }
  .documento-cabeza-seccion { border-bottom: 1px solid var(--borde); padding-bottom: 6px; }
  .documento-cabeza-seccion h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--primario); }
  .documento-marcas { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .boton-observar {
    display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--dorado); border-radius: 999px; background: transparent;
    color: var(--dorado-hover); font-size: 11.5px; font-weight: 600; padding: 3px 10px;
  }
  .boton-observar:hover { background: var(--dorado-suave); }
  .boton-observar .ico { width: 14px; height: 14px; }
  .documento-texto { margin: 0; line-height: 1.6; white-space: pre-wrap; }
  .documento-lista { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; line-height: 1.5; }
  .documento-contexto { margin: 0; font-size: 12.5px; color: var(--texto-suave); font-style: italic; }
  .documento-actividad { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px dashed var(--borde); }
  .documento-actividad h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .documento-imagen { margin: 6px 0 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .documento-imagen .imagen-vista { height: auto; max-width: 420px; width: 100%; }
  .documento-imagen img { max-height: 260px; }
  .documento-imagen figcaption { font-size: 11.5px; font-style: italic; color: var(--texto-suave); }
  .nota.falta { color: var(--aviso); font-weight: 600; }
  .faltantes { border-color: var(--dorado); }
  .faltantes h2, .confirmar h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .faltantes ul { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
  .confirmar { border-color: var(--primario); display: flex; flex-direction: column; gap: 10px; }
  .ajustes { padding-top: 6px; border-top: 1px solid var(--borde); }
  .ajustes p { margin: 0 0 8px; font-weight: 600; }

  /* Documentos generados (fase 4) */
  /* Cómo va la solicitud (vista previa del colaborador) */
  .aviso-estado {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 12px;
    background: var(--primario-suave); color: var(--primario);
  }
  .aviso-estado > .ico { flex-shrink: 0; }
  .aviso-estado-texto { flex: 1; min-width: 220px; }
  .aviso-estado .nota { color: inherit; opacity: .85; margin: 4px 0 0; }
  .aviso-estado.exito { background: var(--exito-suave); color: var(--exito); }
  .aviso-estado.dorado { background: var(--dorado-suave); color: var(--aviso); }
  .aviso-estado.gris { background: var(--fondo); color: var(--texto-suave); border: 1px solid var(--borde); }

  /* Observaciones de Procesos (vista previa y revisión) */
  .lista-observaciones { display: flex; flex-direction: column; gap: 10px; }
  .observaciones-revision { margin: 6px 0 0; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--texto-suave); }
  .observacion { border: 1px solid var(--dorado); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .observacion.estado-atendida { border-color: var(--primario-suave); }
  .observacion.estado-cerrada { border-color: var(--borde); opacity: .75; }
  .observacion-cabeza { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .observacion-cabeza .nota { margin: 0 0 0 auto; }
  .observacion-texto { margin: 0; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .observacion-respuesta {
    margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--fondo); font-size: 12.5px; color: var(--texto-suave);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .observacion-atender { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .observacion-atender textarea, .decision-bloque textarea {
    width: 100%; resize: vertical; border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo); color: var(--texto);
    padding: 9px 12px; font-family: inherit; font-size: 13px; line-height: 1.5;
  }
  .observacion-atender textarea:focus, .decision-bloque textarea:focus { outline: none; border-color: var(--dorado); }

  /* Bandeja de revisión */
  .pestanas { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); margin-bottom: 14px; }
  .pestana {
    display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--texto-suave);
    padding: 9px 12px; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .pestana:hover { color: var(--texto); }
  .pestana.activa { color: var(--primario); border-bottom-color: var(--dorado); }
  .pestana-conteo { min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--fondo); border: 1px solid var(--borde); font-size: 11px; text-align: center; }
  .pestana.activa .pestana-conteo { background: var(--dorado-suave); border-color: var(--dorado); color: var(--aviso); }

  /* Revisión de una solicitud */
  .revision { display: flex; flex-direction: column; gap: 18px; }
  .revision-acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .revision-cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  .revision-lateral { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; max-height: calc(100vh - 120px); overflow-y: auto; }
  .decision { gap: 16px; }
  .decision-bloque { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--borde); }
  .decision-bloque h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .decision-bloque .nota { margin: 0; }
  .decision-bloque summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--peligro); }
  .decision-bloque[open] summary { margin-bottom: 4px; }
  .campo input[data-campo="codigo"] { font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }

  /* Envíos a CH (fase 6) */
  .boton.chico { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
  .boton.chico .ico { width: 15px; height: 15px; }
  .envios-lista { display: flex; flex-direction: column; gap: 12px; }
  .envio { border: 1px solid var(--borde); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .envio-detalle { margin: 0; font-size: 12.5px; color: var(--texto-suave); padding: 8px 10px; border-radius: 8px; background: var(--fondo); }
  .envio-archivos { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .envio-archivos .nota { margin: 0; }
  .envio-descargas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .envio-etiqueta { font-size: 12.5px; font-weight: 600; }
  .envio-formulario { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; padding-top: 12px; border-top: 1px solid var(--borde); }
  .envio-formulario.una-columna { grid-template-columns: 1fr; }
  .envio-enviar { display: flex; }
  .envio-resultado { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--borde); }
  .envio-resultado .envio-formulario { border-top: 0; padding-top: 4px; }
  .envio-pregunta { margin: 0; font-weight: 600; font-size: 13.5px; }

  /* Inventario documental (fase 6) */
  .solicitud-fila.con-detalle { flex-wrap: wrap; }
  .historial-documento { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--borde); }
  .version-documento { display: flex; flex-direction: column; gap: 4px; }
  .version-texto { margin: 0; font-size: 13px; }
  .btn-icono.activo { border-color: var(--dorado); color: var(--dorado-hover); }

  .documentos { display: flex; flex-direction: column; gap: 12px; }
  .documentos-cabeza { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .documentos-cabeza > div { flex: 1; min-width: 240px; }
  .documentos-cabeza h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .documentos-cabeza h2 .ico { color: var(--dorado); }
  .archivos { display: flex; flex-direction: column; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .archivo { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--borde); }
  .archivo:first-child { border-top: 0; }
  .archivo.desactualizado { opacity: .65; }
  .archivo-formato {
    min-width: 48px; text-align: center; padding: 6px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 700;
    background: var(--primario-suave); color: var(--primario);
  }
  .archivo-formato.pdf { background: var(--peligro-suave); color: var(--peligro); }
  .archivo-datos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .archivo-datos strong { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }

  .archivo-datos .chip { align-self: flex-start; margin-top: 2px; }
  .archivo-botones { display: flex; gap: 6px; flex-shrink: 0; }
  /* En la columna angosta de la revisión, el nombre usa todo el ancho y los botones van abajo. */
  .revision-lateral .archivo { flex-wrap: wrap; }
  .revision-lateral .archivo-datos { flex-basis: calc(100% - 64px); }
  .revision-lateral .archivo-botones { margin-left: 60px; }

  /* ─────────── Barra de progreso de la solicitud ─────────── */
  .progreso { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .progreso-pasos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .progreso-pasos li { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center; color: var(--texto-suave); font-size: 11.5px; }
  .progreso-pasos li::before { content: ''; position: absolute; top: 11px; left: calc(-50% + 14px); right: calc(50% + 14px); height: 2px; background: var(--borde); }
  .progreso-pasos li:first-child::before { display: none; }
  .progreso-pasos li.hecho::before, .progreso-pasos li.actual::before { background: var(--exito); }
  .progreso-punto { width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    background: var(--fondo); border: 1px solid var(--borde); color: var(--texto-suave); position: relative; z-index: 1; }
  .progreso-pasos li.hecho .progreso-punto { background: var(--exito-suave); border-color: var(--exito); color: var(--exito); }
  .progreso-pasos li.actual .progreso-punto { background: var(--dorado); border-color: var(--dorado); color: #06263A; }
  .progreso-pasos li.actual { color: var(--texto); font-weight: 600; }
  .progreso.alerta .progreso-pasos li.actual .progreso-punto { background: var(--aviso); border-color: var(--aviso); color: #fff; }
  .progreso.cerrada .progreso-pasos { opacity: .45; }
  .progreso-nota { margin: 0; font-size: 12.5px; color: var(--texto-suave); text-align: center; }
  .progreso.alerta .progreso-nota { color: var(--aviso); font-weight: 600; }
  .vista-ancho > [data-campo="progreso"]:not(:empty) { margin-bottom: 12px; }
  .progreso.compacto { padding: 0; border: 0; background: transparent; gap: 4px; margin-top: 6px; }
  .progreso.compacto .progreso-pasos { gap: 3px; max-width: 360px; }
  .progreso.compacto .progreso-pasos li::before, .progreso.compacto .progreso-nombre { display: none; }
  .progreso.compacto .progreso-punto { width: 100%; height: 6px; border-radius: 3px; font-size: 0; border: 0; }
  .progreso.compacto .progreso-nota { text-align: left; font-size: 11.5px; }
  .revisa { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; font-weight: 600; color: var(--primario); }
  .revisa .ico { width: 15px; height: 15px; }
  .revisa.nadie { color: var(--aviso); }

  /* ─────────── Comentarios de Procesos junto al documento (como en Word) ─────────── */
  .doc-bloque { position: relative; }
  .documento-previo.con-margen .doc-bloque { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 0 18px; align-items: start; }
  .doc-margen { min-width: 0; }
  .comentarios { display: flex; flex-direction: column; gap: 8px; }
  .documento-previo.con-margen .doc-margen .comentarios { border-left: 3px solid var(--dorado); padding-left: 10px; }
  .campo-con-ia .comentarios, .actividad > [data-campo="comentarios"] .comentarios, .derivado .comentarios { margin: 4px 0; }
  .observacion.compacta { padding: 9px 11px; gap: 6px; border-radius: 10px; font-size: 12.5px; }
  .observacion.compacta .observacion-texto { font-size: 12.5px; }
  .observacion.compacta textarea { font-size: 12.5px; }
  .observacion.estado-cambio { border-color: var(--exito); border-style: dashed; }
  .observacion [data-campo="corregir"] { align-self: flex-start; }
  .boton-editar { border-color: var(--primario); color: var(--primario); }
  .boton-editar:hover { background: var(--primario-suave); }
  .documento-enlaces { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .documento-enlaces li { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .documento-enlaces .ico { width: 14px; height: 14px; color: var(--texto-suave); flex-shrink: 0; }
  .documento-enlaces a { overflow-wrap: anywhere; }
  .resaltado { outline: 3px solid var(--dorado); outline-offset: 4px; border-radius: 10px; transition: outline-color .4s; }
  .historial-observaciones summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .historial-observaciones[open] summary { margin-bottom: 12px; }
  @media (max-width: 1100px) {
    .documento-previo.con-margen .doc-bloque { grid-template-columns: 1fr; }
    .documento-previo.con-margen .doc-margen .comentarios { margin: 6px 0 10px; }
  }

  /* ─────────── Paso 3: enlaces, sugerencia en inicio y fin, espera del servidor ─────────── */
  .campo-con-ia { display: flex; flex-direction: column; gap: 8px; }
  .enlaces { display: flex; flex-direction: column; gap: 6px; }
  .enlaces:empty { display: none; }
  .enlace-fila { display: grid; grid-template-columns: auto minmax(120px, 1fr) minmax(160px, 2fr) auto auto; gap: 6px; align-items: center; }
  .enlace-fila > .ico { width: 16px; height: 16px; color: var(--texto-suave); }
  .enlace-fila input { width: 100%; border: 1px solid var(--borde); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13px; background: var(--superficie); color: var(--texto); }
  .enlace-fila input:focus { outline: none; border-color: var(--dorado); }
  .enlace-fila [data-campo="error"] { grid-column: 2 / -1; margin: 0; font-size: 12px; }
  .enlace-fila a[hidden] { display: none; }
  .adjuntar { flex-wrap: wrap; }
  button.boton-adjuntar { border: 0; background: transparent; font: inherit; cursor: pointer; padding: 0; }
  .editor.actualizando .desarrollo, .editor.actualizando .siguiente-paso { pointer-events: none; opacity: .7; }
  @media (max-width: 640px) {
    .enlace-fila { grid-template-columns: auto 1fr auto auto; }
    .enlace-fila [data-campo="url"] { grid-column: 2 / 3; }
    .enlace-fila [data-campo="texto"] { grid-column: 2 / -1; }
  }

  /* ─────────── Visor de archivos y ventana de corrección ─────────── */
  .visor-archivo { justify-content: flex-start; padding: 0; gap: 0; }
  .visor-archivo-barra { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--superficie); color: var(--texto); }
  .visor-archivo-barra strong { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .visor-archivo-hojas { width: 100%; flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 12px 32px; }
  .visor-hoja { background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.35); max-width: 100%; }
  .visor-archivo-cargando { color: #e8eef1; display: flex; align-items: center; gap: 8px; margin: 40px 0; }
  .visor-archivo-hojas .docx-wrapper { background: transparent; padding: 0; }
  .dialogo-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(6,38,58,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialogo { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .dialogo h2 { margin: 0; font-size: 17px; }
  .dialogo textarea, .dialogo input { width: 100%; border: 1px solid var(--borde); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13.5px; background: var(--superficie); color: var(--texto); resize: vertical; }
  .dialogo textarea:focus, .dialogo input:focus { outline: none; border-color: var(--dorado); }

  /* ─────────── Tablero ─────────── */
  .tablero { display: flex; flex-direction: column; gap: 16px; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .cifra { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .cifra-titulo { font-size: 12px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .4px; }
  .cifra-valor { font-size: 26px; font-weight: 700; color: var(--texto); line-height: 1.1; }
  .cifra .nota { margin: 0; font-size: 12px; }
  .cifra.alerta { border-color: var(--dorado); }
  .cifra.alerta .nota { color: var(--aviso); font-weight: 600; }
  .tablero-dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .tablero-bloque { display: flex; flex-direction: column; gap: 10px; }
  .tablero-bloque h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .barra-fila { display: grid; grid-template-columns: 150px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 12.5px; }
  .barra-nombre { color: var(--texto-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra-pista { height: 14px; display: block; }
  .barra-valor { display: block; height: 100%; background: var(--primario); border-radius: 0 4px 4px 0; }
  .barra-numero { font-weight: 600; text-align: right; color: var(--texto); }
  .leyenda { display: flex; gap: 14px; font-size: 12px; color: var(--texto-suave); }
  .leyenda-item { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda-marca { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .serie-1 { background: var(--primario); }
  .serie-2 { background: var(--dorado); }
  .meses { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; height: 170px; align-items: end; border-bottom: 1px solid var(--borde); }
  .mes { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .mes-barras { display: flex; gap: 2px; align-items: flex-end; height: calc(100% - 20px); width: 100%; justify-content: center; }
  .mes-barra { width: 40%; max-width: 22px; border-radius: 4px 4px 0 0; position: relative; }
  .mes-numero { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 600; color: var(--texto); }
  .mes-nombre { font-size: 11px; color: var(--texto-suave); white-space: nowrap; }
  .tabla-desplazable { overflow-x: auto; }
  .tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabla th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .3px; padding: 6px 8px; border-bottom: 1px solid var(--borde); }
  .tabla td { padding: 8px; border-bottom: 1px solid var(--borde); }
  .tabla .numero { text-align: right; white-space: nowrap; }
  @media (max-width: 640px) {
    .barra-fila { grid-template-columns: 110px minmax(0, 1fr) 30px; }
    .progreso-nombre { display: none; }
  }

  /* Historial de cambios de una solicitud */
  .historial summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .historial[open] summary { margin-bottom: 8px; }
  .historial-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .historial-entrada { border-left: 3px solid var(--borde); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 6px; }
  .historial-entrada.tipo-procesos { border-left-color: var(--dorado); }
  .historial-entrada.tipo-ia { border-left-color: var(--primario); }
  .historial-cabeza { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 13px; }
  .historial-cabeza .nota { margin: 0 0 0 auto; font-size: 12px; }
  .historial-detalle { margin: 0; font-size: 12.5px; color: var(--texto-suave); white-space: pre-wrap; overflow-wrap: anywhere; }
  .historial-texto { white-space: pre-wrap; }
  .revision-lateral .historial .comparacion { grid-template-columns: 1fr; }

  /* Fase 7: documento a actualizar, control de cambios e importación; puestos */
  .opciones-documento { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; margin-top: 10px; }
  .motivos { display: flex; flex-direction: column; gap: 8px; }
  .motivo .chip { margin-left: 4px; }
  .control-cambios textarea, .area-larga { width: 100%; border: 1px solid var(--borde); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13.5px; background: var(--superficie); color: var(--texto); resize: vertical; }
  .control-cambios { display: flex; flex-direction: column; gap: 10px; }
  .importacion { max-height: 50vh; overflow-y: auto; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; }
  .importacion-actividades { margin: 6px 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; }
  .importacion-actividades .chip { margin-left: 6px; }

  .formulario-puesto { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .formulario-puesto h2, [data-campo="pegado"] h2 { margin: 0; font-size: 16px; }
  [data-campo="pegado"] { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

  /* Sin acceso */
  .pantalla-completa { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .sin-acceso { max-width: 460px; width: 100%; text-align: center; }
  .sin-acceso .menu-logo { width: 56px; height: 56px; margin: 0 auto 6px; display: block; box-shadow: var(--sombra); }
  .correo { font-weight: 600; word-break: break-all; }

  /* ─────────── Tableta y celular ─────────── */
  /* Con «Ver como» la barra se llena: primero se va la fecha y la palabra «Ver como». */
  .barra-izq { flex-shrink: 0; }
  @media (max-width: 1280px) {
    .barra-fecha, .ver-como-texto { display: none; }
    .ver-como select { max-width: 190px; }
  }
  @media (max-width: 1100px) {

  }
  @media (max-width: 1000px) {

  }
  @media (max-width: 860px) {
    #menu {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: 268px;
      transform: translateX(-100%); transition: transform .25s ease;
    }
    #menu.abierto { transform: translateX(0); box-shadow: var(--sombra-grande); }
    #menu.colapsado { width: 268px; }
    .menu-colapsar { display: none; }
    .menu-fondo { position: fixed; inset: 0; z-index: 30; background: rgba(6,38,58,.45); }

  }
  @media (max-width: 640px) {
    .barra { padding: 8px 16px; }
    .barra-logo { height: 28px; }
    .usuario-datos { display: none; }

    .tarjeta { padding: 16px; }

    .ver-como { padding: 3px 4px 3px 8px; }
    .ver-como select { max-width: 120px; }
    .aviso-ambiente { font-size: 11px; }
    .catalogo-fila { gap: 10px; padding: 10px 12px; }
    .catalogo-cuerpo { min-width: 52px; }

  @media (max-width: 640px) {

    .usuario-fila .avatar { display: none; }

    .bitacora-fecha { margin-left: 0; width: 100%; }
    .solicitud-fila { flex-direction: column; align-items: stretch; }
    .solicitud-botones { justify-content: flex-end; }
    .actividad { padding: 12px; }

    .paso-captura { font-size: 11.5px; }
    .comparacion { grid-template-columns: 1fr; }
