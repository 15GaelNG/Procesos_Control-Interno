<template id="vista-inicio">
  <div class="vista-ancho">
    <header class="saludo">
      <h1><span class="texto-aurora" data-campo="saludo"></span></h1>
      <p>¿Qué quieres hacer hoy?</p>
      <div class="chips" data-campo="perfiles"></div>
    </header>

    <div class="accesos" data-campo="accesos"></div>
    <div class="tarjeta" data-campo="sin-accesos" hidden>
      <div class="vacio">
        <span class="vacio-icono"><i data-lucide="user-x" class="ico"></i></span>
        <h2>Todavía no tienes un perfil asignado</h2>
        <p>Pide al área de Procesos que te asigne uno (colaborador, revisor o administrador) para ver tus opciones.</p>
      </div>
    </div>

    <h2 class="seccion">Cómo funciona</h2>
    <div class="tarjeta">
      <div class="pasos">
        <div class="paso">
          <span class="paso-num"><i data-lucide="pen-line" class="ico"></i></span>
          <strong>1. Documenta tu proceso</strong>
          <p>Escribe cómo inicia, cada actividad con su responsable y agrega capturas de pantalla.</p>
        </div>
        <div class="paso">
          <span class="paso-num es-ia"><i data-lucide="sparkles" class="ico"></i></span>
          <strong>2. La IA te ayuda</strong>
          <p>Mejora la redacción y te pregunta lo que falta. Tú decides qué aceptar; nunca inventa información.</p>
        </div>
        <div class="paso">
          <span class="paso-num"><i data-lucide="clipboard-check" class="ico"></i></span>
          <strong>3. Procesos revisa</strong>
          <p>Si hay observaciones, regresa contigo. Si está completo, Procesos da su Vo.Bo.</p>
        </div>
        <div class="paso">
          <span class="paso-num"><i data-lucide="badge-check" class="ico"></i></span>
          <strong>4. Se autoriza en CH</strong>
          <p>El responsable y el director autorizan en el sistema de Capital Humano. Al autorizarse, sale el documento oficial.</p>
        </div>
      </div>
    </div>
  </div>
</template>
