<template id="vista-mis-solicitudes">
  <div class="vista-ancho">
    <div class="encabezado-vista">
      <div>
        <h1 class="titulo-vista"><i data-lucide="folder-open" class="ico"></i>Mis solicitudes</h1>
        <p class="subtitulo">Los documentos que estás elaborando o actualizando, y en qué etapa va cada uno.</p>
      </div>
      <button type="button" class="boton" data-accion="nueva"><i data-lucide="file-plus-2" class="ico"></i>Nueva solicitud</button>
    </div>
    <div class="tarjeta">
      <div class="barra-filtros">
        <label class="buscador">
          <i data-lucide="search" class="ico"></i>
          <input type="search" data-campo="buscar" placeholder="Buscar por nombre o folio">
        </label>
        <label class="interruptor">
          <input type="checkbox" data-campo="cerradas">
          <span>Mostrar canceladas</span>
        </label>
      </div>
      <div data-campo="contenido" class="solicitudes-lista">
        <div class="vacio"><span class="vacio-icono"><i data-lucide="loader" class="ico girando"></i></span><p>Cargando…</p></div>
      </div>
    </div>
  </div>
</template>
