<template id="vista-nueva">
  <div class="vista-ancho">
    <div>
      <h1 class="titulo-vista"><i data-lucide="file-plus-2" class="ico"></i>Nueva solicitud</h1>
      <p class="subtitulo">Primero los datos generales. Lo demás (tu nombre, puesto y fecha) lo pone el sistema.</p>
    </div>
    <div class="pasos-captura" aria-label="Pasos">
      <span class="paso-captura actual"><span>2</span>Información general</span>
      <span class="paso-captura"><span>3</span>Desarrollo del proceso</span>
      <span class="paso-captura"><span>4</span>Análisis con IA</span>
      <span class="paso-captura"><span>5</span>Vista previa y confirmación</span>
    </div>

    <div data-campo="contenido">
      <div class="tarjeta"><div class="vacio"><span class="vacio-icono"><i data-lucide="loader" class="ico girando"></i></span><p>Cargando…</p></div></div>
    </div>
  </div>
</template>

<template id="parte-formulario-nueva">
  <form class="tarjeta formulario-nueva" novalidate>
    <fieldset class="campo">
      <legend>¿Qué quieres hacer?</legend>
      <div class="opciones-tarjeta" data-campo="tipos-solicitud"></div>
    </fieldset>
    <fieldset class="campo">
      <legend>Tipo de documento</legend>
      <div class="opciones-tarjeta" data-campo="tipos-documento"></div>
    </fieldset>
    <label class="campo">
      <span>Nombre del documento</span>
      <input type="text" name="nombre" maxlength="150" autocomplete="off" placeholder="Ej. Alta de proveedores">
      <small>Un nombre claro de lo que describe el proceso. Revisaremos si ya existe uno parecido.</small>
    </label>
    <div class="coincidencias" data-campo="coincidencias" hidden></div>
    <div class="campos-fila">
      <label class="campo">
        <span>Departamento</span>
        <select class="selector" name="departamento"></select>
      </label>
      <label class="campo">
        <span>Área</span>
        <select class="selector" name="area"></select>
      </label>
      <label class="campo" data-campo="campo-subarea">
        <span>Subárea <em class="opcional">(opcional)</em></span>
        <select class="selector" name="subarea"></select>
      </label>
    </div>
    <div class="datos-automaticos">
      <div><span>Elabora</span><strong data-campo="elaborador"></strong></div>
      <div><span>Puesto</span><strong data-campo="puesto"></strong></div>
      <div><span>Fecha de elaboración</span><strong data-campo="fecha"></strong></div>
      <div><span>Código</span><strong data-campo="codigo">Lo asigna Procesos</strong></div>
      <div><span>Versión</span><strong>Se asigna al autorizarse</strong></div>
    </div>
    <div class="errores" data-campo="errores" hidden></div>
    <div class="acciones-formulario">
      <button type="submit" class="boton" data-accion="crear"><span>Crear y continuar</span><i data-lucide="arrow-right" class="ico"></i></button>
    </div>
  </form>
</template>
