<template id="vista-tablero">
  <div class="vista-ancho">
    <div class="encabezado-vista">
      <div>
        <h1 class="titulo-vista"><i data-lucide="chart-column" class="ico"></i>Tablero</h1>

      <button type="button" class="boton secundario" data-accion="recargar"><i data-lucide="refresh-cw" class="ico"></i>Actualizar</button>

    </div>
  </div>
