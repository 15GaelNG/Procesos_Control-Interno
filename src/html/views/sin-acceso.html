<!-- Pantalla de entrada (js/entrada.html → montarEntrada): fotos y logos a la izquierda, la tarjeta a la derecha. -->
<template id="vista-entrada">
  <div class="entrada">
    <section class="entrada-hero">
      <div class="entrada-escenas" data-base="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/"></div>
      <div class="entrada-velo"></div>
      <div class="entrada-marcas">
        <img class="entrada-cm" src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/CMTC-Dark.png" alt="Ciudad Maderas">
        <span class="entrada-separador"></span>
        <span class="entrada-ci"><img src="https://raw.githubusercontent.com/15GaelNG/Inventario_Control-Interno/master/assets/logo.png" alt=""><span>Control<br>Interno</span></span>
      </div>
      <div class="entrada-cuerpo">
        <span class="logo-recorte logo-procesos-h entrada-procesos"><img src="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/procesos_logo_horizontal_dark.png" alt="Procesos · Documentación y Control"></span>
        <h1 class="entrada-titulo">Tus procesos, <em>documentados y en orden</em>.</h1>
        <p class="entrada-sub">Escribe cómo trabajas actividad por actividad, con sus capturas. La IA te ayuda con la redacción y el área de Procesos lo revisa antes de su autorización.</p>
      </div>
      <div class="entrada-funciones">
        <div class="entrada-funcion"><i data-lucide="pen-line" class="ico"></i><span>Documenta</span></div>
        <div class="entrada-funcion"><i data-lucide="sparkles" class="ico"></i><span>La IA te ayuda</span></div>
        <div class="entrada-funcion"><i data-lucide="clipboard-check" class="ico"></i><span>Procesos revisa</span></div>
        <div class="entrada-funcion"><i data-lucide="library" class="ico"></i><span>Inventario</span></div>
      </div>
    </section>
    <section class="entrada-panel">
      <div class="selector-tema entrada-tema" role="group" aria-label="Tema">
        <button type="button" class="btn-tema" data-tema="light" title="Modo claro"><i data-lucide="sun" class="ico"></i></button>
        <button type="button" class="btn-tema" data-tema="dark" title="Modo oscuro"><i data-lucide="moon" class="ico"></i></button>
      </div>
      <div data-campo="tarjeta"></div>
      <p class="entrada-pie">Ciudad Maderas · Control Interno · Procesos</p>
    </section>
  </div>
</template>

<template id="vista-sin-acceso">
  <div class="tarjeta sin-acceso">
    <span class="logo-recorte logo-procesos-v logo-claro"><img src="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/procesos_logo_vertical_light.png" alt="Procesos · Documentación y Control"></span>
    <span class="logo-recorte logo-procesos-v logo-oscuro"><img src="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/procesos_logo_vertical_dark.png" alt="Procesos · Documentación y Control"></span>
    <div class="vacio">
      <span class="vacio-icono"><i data-lucide="shield-alert" class="ico"></i></span>
      <h2 data-campo="titulo">Todavía no tienes acceso</h2>
      <p data-campo="mensaje"></p>
      <button type="button" class="boton secundario" data-accion="reintentar">
        <i data-lucide="refresh-cw" class="ico"></i>Volver a intentar
      </button>
    </div>
  </div>
</template>

<!-- La primera vez que alguien entra (o si le falta el puesto o el departamento): js/app.html → mostrarRegistro. -->
<template id="vista-registro">
  <form class="tarjeta sin-acceso registro" novalidate>
    <span class="logo-recorte logo-procesos-v logo-claro"><img src="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/procesos_logo_vertical_light.png" alt="Procesos · Documentación y Control"></span>
    <span class="logo-recorte logo-procesos-v logo-oscuro"><img src="https://raw.githubusercontent.com/15GaelNG/Imagenes-Ciudad-Maderas/main/procesos_logo_vertical_dark.png" alt="Procesos · Documentación y Control"></span>
    <div class="registro-texto">
      <h1 data-campo="titulo">Te damos la bienvenida</h1>
      <p class="subtitulo" data-campo="mensaje"></p>
    </div>
    <label class="campo" data-campo="bloque-nombre">
      <span>Tu nombre completo</span>
      <input type="text" name="nombre" maxlength="120" autocomplete="name" placeholder="Nombre y apellidos">
    </label>
    <label class="campo" data-campo="bloque-puesto">
      <span>Tu puesto</span>
      <input type="text" name="puesto" list="registro-puestos" maxlength="120" autocomplete="off" placeholder="Ej. Auxiliar de Compras">
      <datalist id="registro-puestos" data-campo="puestos"></datalist>
      <small>Sale en «Elaboró» o «Revisó» de los documentos. Si no está en la lista, escríbelo.</small>
    </label>
    <label class="campo" data-campo="bloque-departamento">
      <span>Tu departamento</span>
      <select class="selector" name="departamento"></select>
      <small>Es el de los documentos que vas a elaborar. Si necesitas otro, pídeselo a Procesos.</small>
    </label>
    <p class="errores" data-campo="errores" hidden></p>
    <button type="submit" class="boton boton-grande"><i data-lucide="log-in" class="ico"></i><span>Entrar al sistema</span></button>
    <p class="nota registro-nota"><i data-lucide="shield-check" class="ico"></i><span>Entras con tu cuenta de Google <strong data-campo="correo"></strong>: no necesitas contraseña.</span></p>
  </form>
</template>
