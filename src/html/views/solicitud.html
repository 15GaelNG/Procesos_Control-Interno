<template id="vista-solicitud">
  <div class="vista-ancho">
    <button type="button" class="enlace-volver" data-accion="volver"><i data-lucide="arrow-left" class="ico"></i>Mis solicitudes</button>
    <nav class="pasos-captura" aria-label="Pasos de la solicitud">
      <span class="paso-captura hecho"><span>2</span>Información general</span>
      <button type="button" class="paso-captura" data-paso="desarrollo"><span>3</span>Desarrollo del proceso</button>
      <button type="button" class="paso-captura" data-paso="analisis"><span>4</span>Análisis con IA</button>
      <button type="button" class="paso-captura" data-paso="vista"><span>5</span>Vista previa y confirmación</button>
    </nav>
    <div data-campo="contenido">
      <div class="tarjeta"><div class="vacio"><span class="vacio-icono"><i data-lucide="loader" class="ico girando"></i></span><p>Abriendo la solicitud…</p></div></div>
    </div>
  </div>
</template>

<template id="parte-editor">
  <div class="encabezado-solicitud tarjeta">
    <div class="encabezado-solicitud-titulo">
      <div>
        <span class="folio" data-campo="folio"></span>
        <h1 data-campo="nombre"></h1>
      </div>
      <span class="chip" data-campo="estado"></span>
    </div>
    <div class="datos-automaticos" data-campo="datos"></div>
  </div>

  <div class="aviso-consulta" data-campo="solo-lectura" hidden>
    <i data-lucide="eye" class="ico"></i><span data-campo="solo-lectura-texto"></span>
  </div>
  <div class="aviso-consulta dorado" data-campo="devuelta" hidden>
    <i data-lucide="message-square-warning" class="ico"></i>
    <span>Procesos te regresó esta solicitud con observaciones. Corrige aquí lo necesario y atiéndelas en el paso 5.</span>
    <button type="button" class="enlace" data-accion="ver-observaciones">Ver observaciones</button>
  </div>
  <div class="aviso-conflicto" data-campo="conflicto" hidden>
    <i data-lucide="triangle-alert" class="ico"></i>
    <span>Esta solicitud cambió en otra ventana o pestaña. Para no perder nada, recarga la página antes de seguir.</span>
  </div>

  <section class="tarjeta desarrollo">
    <div class="desarrollo-encabezado">
      <div>
        <h2>Desarrollo del proceso</h2>
        <p class="nota">Se guarda solo mientras escribes.</p>
      </div>
      <span class="estado-guardado" data-campo="guardado"></span>
    </div>

    <label class="campo">
      <span>¿Qué sucede para que inicie este proceso?</span>
      <textarea name="inicio" rows="2" maxlength="2000" placeholder="Ej. Cuando el departamento solicitante envía la solicitud."></textarea>
    </label>

    <div class="separador"></div>

    <div>
      <h3 class="subtitulo-seccion">Describe las actividades en orden</h3>
      <p class="nota">En cada actividad, menciona qué se hace y quién lo realiza. Puedes adjuntar imágenes o pegar capturas con <kbd>Ctrl</kbd> + <kbd>V</kbd>.</p>
    </div>
    <div class="actividades" data-campo="actividades"></div>
    <button type="button" class="boton-agregar" data-accion="agregar"><i data-lucide="plus" class="ico"></i>Agregar siguiente actividad</button>

    <div class="separador"></div>

    <label class="campo">
      <span>¿Cómo finaliza el proceso?</span>
      <textarea name="fin" rows="2" maxlength="2000" placeholder="Ej. Cuando se autoriza la solicitud y se notifica al interesado."></textarea>
    </label>
  </section>

  <div class="tarjeta siguiente-paso">
    <div>
      <strong>Siguiente paso: análisis con IA</strong>
      <p class="nota">La IA revisará la redacción, los responsables y lo que falte, y te hará preguntas. Tú decides qué aceptar.</p>
    </div>
    <button type="button" class="boton" data-accion="ir-analisis"><span>Ir al análisis</span><i data-lucide="arrow-right" class="ico"></i></button>
  </div>
</template>

<template id="parte-actividad">
  <article class="actividad">
    <header class="actividad-encabezado">
      <h4 data-campo="titulo"></h4>
      <div class="actividad-botones">
        <button type="button" class="btn-icono chico" data-accion="subir" title="Subir"><i data-lucide="arrow-up" class="ico"></i></button>
        <button type="button" class="btn-icono chico" data-accion="bajar" title="Bajar"><i data-lucide="arrow-down" class="ico"></i></button>
        <button type="button" class="btn-icono chico" data-accion="eliminar" title="Eliminar actividad"><i data-lucide="trash-2" class="ico"></i></button>
      </div>
    </header>
    <textarea data-campo="texto" rows="3" maxlength="4000" placeholder="Ej. El auxiliar recibe la solicitud y revisa que los documentos estén completos."></textarea>
    <label class="responsable">
      <i data-lucide="user-round" class="ico"></i>
      <input type="text" data-campo="responsable" maxlength="120" placeholder="¿Qué puesto la realiza? (si no lo dijiste en el texto)">
    </label>
    <div class="imagenes" data-campo="imagenes"></div>
    <div class="adjuntar">
      <label class="boton-adjuntar">
        <i data-lucide="image-plus" class="ico"></i><span>Adjuntar imagen a esta actividad</span>
        <input type="file" data-campo="archivo" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </label>
      <span class="nota">o pega una captura con Ctrl + V mientras escribes en la actividad</span>
    </div>
  </article>
</template>

<template id="parte-imagen">
  <figure class="imagen">
    <button type="button" class="imagen-vista" data-accion="ver" title="Ver en grande"><img alt=""></button>
    <figcaption>
      <input type="text" data-campo="pie" maxlength="200" placeholder="Pie de imagen: qué muestra">
    </figcaption>
    <div class="imagen-botones">
      <button type="button" class="btn-icono chico" data-accion="izquierda" title="Mover antes"><i data-lucide="arrow-left" class="ico"></i></button>
      <button type="button" class="btn-icono chico" data-accion="derecha" title="Mover después"><i data-lucide="arrow-right" class="ico"></i></button>
      <button type="button" class="btn-icono chico" data-accion="quitar" title="Quitar imagen"><i data-lucide="x" class="ico"></i></button>
    </div>
  </figure>
</template>

<template id="parte-visor">
  <div class="visor" role="dialog" aria-modal="true">
    <button type="button" class="btn-icono visor-cerrar" data-accion="cerrar" title="Cerrar"><i data-lucide="x" class="ico"></i></button>
    <img alt="">
    <p class="visor-pie" data-campo="pie"></p>
  </div>
</template>
