<template id="parte-vista-previa">
  <div class="vista-previa">
    <div class="aviso-estado" data-campo="aviso-estado" hidden>
      <i data-campo="aviso-icono" class="ico"></i>
      <div class="aviso-estado-texto">
        <strong data-campo="aviso-titulo"></strong>
        <p class="nota" data-campo="aviso-texto"></p>
      </div>
      <button type="button" class="boton secundario" data-accion="primera-observacion" hidden><i data-lucide="arrow-down" class="ico"></i>Ir a la primera</button>
      <button type="button" class="boton" data-accion="enviar" hidden><i data-lucide="send" class="ico"></i><span>Enviar a revisión de Procesos</span></button>
    </div>

    <section class="tarjeta documentos" data-campo="documentos" hidden>
      <div class="documentos-cabeza">
        <div>
          <h2><i data-lucide="file-down" class="ico"></i>Documento preliminar</h2>
          <p class="nota">Word y PDF con la plantilla institucional y la leyenda «COPIA NO AUTORIZADA». Cada vez que lo generas se crea uno nuevo; los anteriores se conservan.</p>
        </div>
        <button type="button" class="boton" data-accion="generar"><i data-lucide="file-plus" class="ico"></i><span>Generar Word y PDF</span></button>
      </div>
      <div class="analizando" data-campo="generando" hidden>
        <span class="vacio-icono"><i data-lucide="loader" class="ico girando"></i></span>
        <div><strong>Generando el documento…</strong><p class="nota">Puede tardar hasta un minuto, sobre todo si tiene muchas imágenes.</p></div>
      </div>
      <div class="lista-archivos" data-campo="archivos"></div>
    </section>

    <div data-campo="documento"></div>

    <div data-campo="lugar-control-cambios"></div>

    <section class="tarjeta faltantes" data-campo="faltantes" hidden>
      <h2><i data-lucide="list-todo" class="ico"></i>Antes de confirmar falta:</h2>
      <ul data-campo="lista-faltantes"></ul>
      <div class="pregunta-botones">
        <button type="button" class="boton secundario" data-accion="ir-desarrollo">Ir al desarrollo (paso 3)</button>
        <button type="button" class="boton secundario" data-accion="ir-analisis">Ir a la corrección con IA (paso 4)</button>
      </div>
    </section>

    <section class="tarjeta confirmar" data-campo="confirmar" hidden>
      <h2>¿Todo lo que dice el documento es correcto?</h2>
      <p class="nota" data-campo="nota-confirmar"></p>
      <div class="pregunta-botones">
        <button type="button" class="boton" data-accion="confirmar"><i data-lucide="send" class="ico"></i><span>Sí, es correcto: enviar a Procesos</span></button>
        <button type="button" class="boton secundario" data-accion="ajustes"><i data-lucide="pencil" class="ico"></i>No, necesito corregir algo</button>
      </div>
      <p class="nota">Confirmar no es el Vo.Bo. de Procesos: después lo revisan y, si hace falta, te lo regresan con observaciones.</p>
    </section>

    <details class="tarjeta seccion-analisis historial-observaciones" data-campo="observaciones" hidden>
      <summary><i data-lucide="message-square-warning" class="ico"></i><span data-campo="titulo-observaciones">Historial de observaciones de Procesos</span></summary>
      <div class="lista-observaciones" data-campo="lista-observaciones"></div>
    </details>
  </div>
</template>

<template id="parte-control-cambios">
  <section class="tarjeta seccion-analisis control-cambios">
    <h2><i data-lucide="git-compare-arrows" class="ico"></i>Control de cambios</h2>
    <p class="nota" data-campo="ayuda"></p>
    <fieldset class="campo">
      <legend>Motivo del cambio</legend>
      <div class="motivos" data-campo="motivos"></div>
    </fieldset>
    <label class="campo">
      <span>¿Qué cambió?</span>
      <textarea rows="3" maxlength="2000" data-campo="descripcion" placeholder="Ej. Se agregó la validación del jefe de Compras antes del alta en SAP."></textarea>
    </label>
    <span class="estado-guardado" data-campo="guardado"></span>
  </section>
</template>

<template id="parte-historial">
  <details class="tarjeta seccion-analisis historial">
    <summary><i data-lucide="history" class="ico"></i>Historial de cambios</summary>
    <p class="nota">Quién cambió qué y cuándo: las correcciones de Procesos y las propuestas de la IA que se aceptaron (cómo estaba y cómo quedó), y cada paso del trámite.</p>
    <div class="historial-lista" data-campo="lista"><p class="nota">Cargando…</p></div>
  </details>
</template>

<template id="parte-observacion">
  <article class="observacion">
    <div class="observacion-cabeza">
      <span class="chip" data-campo="apartado"></span>
      <span class="chip" data-campo="estado"></span>
      <span class="nota" data-campo="quien"></span>
    </div>
    <p class="observacion-texto" data-campo="texto"></p>
    <p class="observacion-respuesta" data-campo="respuesta" hidden></p>
    <button type="button" class="boton chico" data-campo="corregir" hidden><i data-lucide="pencil" class="ico"></i>Corregir aquí</button>
    <div class="observacion-atender" data-campo="atender" hidden>
      <textarea rows="2" maxlength="2000" placeholder="¿Qué corregiste? (opcional)"></textarea>
      <button type="button" class="boton secundario chico" data-accion="atender"><i data-lucide="check" class="ico"></i><span>Marcar como atendida</span></button>
    </div>
    <div class="pregunta-botones" data-campo="revisor" hidden>
      <button type="button" class="boton secundario chico" data-accion="cerrar"><i data-lucide="check-check" class="ico"></i>Cerrar</button>
      <button type="button" class="boton secundario chico" data-accion="reabrir"><i data-lucide="rotate-ccw" class="ico"></i>Reabrir</button>
    </div>
  </article>
</template>

<template id="parte-visor-archivo">
  <div class="visor visor-archivo" role="dialog" aria-modal="true">
    <div class="visor-archivo-barra">
      <strong data-campo="nombre"></strong>
      <button type="button" class="boton secundario chico" data-accion="descargar"><i data-lucide="download" class="ico"></i>Descargar</button>
      <button type="button" class="btn-icono" data-accion="cerrar" title="Cerrar"><i data-lucide="x" class="ico"></i></button>
    </div>
    <div class="visor-archivo-hojas" data-campo="hojas">
      <p class="visor-archivo-cargando" data-campo="cargando"><i data-lucide="loader" class="ico girando"></i> Abriendo el documento…</p>
    </div>
  </div>
</template>
