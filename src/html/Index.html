    <main id="principal">

          </button>

            <button type="button" class="btn-tema" data-tema="dark" title="Modo oscuro"><i data-lucide="moon" class="ico"></i></button>

          <div class="barra-fecha" id="barra-fecha"></div>

            <div class="usuario-datos">
              <strong id="usuario-nombre"></strong>
              <span id="usuario-perfiles"></span>
            </div>
          </div>
        </div>
      </header>
      <section id="vista" class="vista" tabindex="-1"></section>
    </main>
